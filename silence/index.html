<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILENCE // 静默</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --text: #00ff88;
  --text-dim: #006633;
  --accent: #ff4455;
  --gold: #ffaa00;
  --blue: #4488ff;
  --border: #1a1a2e;
  --font: 'Courier New', 'Consolas', 'Liberation Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ─── INTRO OVERLAY ─── */
.intro-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-size: clamp(0.85rem, 2.5vw, 1.1rem);
  color: #00ff88;
  line-height: 2;
  letter-spacing: 1px;
  transition: opacity 0.6s ease;
  cursor: default;
}
.intro-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}
.intro-overlay .intro-line {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.intro-overlay .intro-line.visible {
  opacity: 1;
  transform: translateY(0);
}
.intro-overlay .intro-line.highlight {
  color: #ff4455;
  text-shadow: 0 0 12px rgba(255,68,85,0.6);
}
.intro-overlay .intro-click {
  margin-top: 28px;
  font-size: 0.7rem;
  color: #004422;
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.intro-overlay .intro-cursor {
  display: inline-block;
  width: 8px;
  height: 1em;
  background: #00ff88;
  margin-left: 2px;
  animation: blink 0.8s step-end infinite;
  vertical-align: text-bottom;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 16px 24px;
}

/* HEADER */
.header {
  text-align: center;
  padding: 16px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.header h1 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  letter-spacing: 4px;
  color: var(--text);
  text-shadow: 0 0 20px rgba(0,255,136,0.3);
}
.phase-indicator {
  font-size: 0.75rem;
  color: var(--accent);
  letter-spacing: 3px;
  margin-top: 2px;
  animation: phasePulse 3s ease-in-out infinite;
}
@keyframes phasePulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* CORE AREA */
.core-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0 24px;
  position: relative;
}
.cp-display {
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: bold;
  color: var(--text);
  text-shadow: 0 0 30px rgba(0,255,136,0.4);
  letter-spacing: 2px;
  transition: color 0.3s;
}
.cp-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.cps-display {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 16px;
  transition: color 0.3s;
}
.cps-display.pulse {
  color: var(--text);
  text-shadow: 0 0 10px rgba(0,255,136,0.5);
}

/* SERVER CORE */
.core-wrapper {
  position: relative;
  width: 180px;
  height: 180px;
  margin-bottom: 8px;
}
.core {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  background: radial-gradient(circle at 30% 30%, #1a3a2a, #0a1a0f);
  border: 3px solid #00ff88;
  box-shadow: 0 0 40px rgba(0,255,136,0.25), inset 0 0 40px rgba(0,255,136,0.08);
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.core::before {
  content: '';
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,136,0.2);
  animation: coreSpin 8s linear infinite;
}
.core::after {
  content: '';
  position: absolute;
  inset: 28px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,136,0.15) 0%, transparent 70%);
  animation: corePulse 2s ease-in-out infinite;
}
.core:active {
  transform: scale(0.92);
}
.core.punch {
  transform: scale(1.08);
  box-shadow: 0 0 70px rgba(0,255,136,0.5), inset 0 0 60px rgba(0,255,136,0.2);
}
.core-symbol {
  font-size: 2.5rem;
  color: rgba(0,255,136,0.5);
  z-index: 2;
  pointer-events: none;
  animation: corePulse 2s ease-in-out infinite;
}
@keyframes coreSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes corePulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.04); }
}
.click-hint {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 4px;
}

/* FLOATING TEXT */
.float-text {
  position: absolute;
  pointer-events: none;
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--text);
  text-shadow: 0 0 8px rgba(0,255,136,0.6);
  animation: floatUp 0.8s ease-out forwards;
  z-index: 100;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
}

/* UPGRADES */
.upgrades-section {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 700px) {
  .upgrades-section {
    grid-template-columns: 1fr;
  }
}
.upgrade-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  transition: border-color 0.3s, box-shadow 0.3s;
  position: relative;
}
.upgrade-card.locked {
  opacity: 0.35;
  filter: grayscale(0.8);
  pointer-events: none;
}
.upgrade-card.unlocking {
  animation: unlockFlash 0.6s ease-out;
}
.upgrade-card.buy-flash {
  animation: buyFlash 0.5s ease-out;
}
@keyframes unlockFlash {
  0% { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,170,0,0.5); }
  100% { border-color: var(--border); box-shadow: none; }
}
@keyframes buyFlash {
  0% { background: rgba(255,170,0,0.15); border-color: var(--gold); }
  100% { background: var(--surface); border-color: var(--border); }
}
.upgrade-name {
  font-size: 0.85rem;
  font-weight: bold;
  color: var(--text);
  margin-bottom: 2px;
}
.upgrade-desc {
  font-size: 0.65rem;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.upgrade-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7rem;
}
.upgrade-level {
  color: #888;
}
.upgrade-cost {
  color: var(--gold);
}
.upgrade-btn {
  width: 100%;
  margin-top: 6px;
  padding: 5px 0;
  background: transparent;
  border: 1px solid var(--text-dim);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.7rem;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.upgrade-btn:hover {
  background: rgba(0,255,136,0.08);
  border-color: var(--text);
}
.upgrade-btn:active {
  background: rgba(0,255,136,0.15);
}
.upgrade-btn.cant-afford {
  color: #444;
  border-color: #222;
  cursor: not-allowed;
}

/* BOTTOM PANELS */
.bottom-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 700px) {
  .bottom-panels {
    grid-template-columns: 1fr;
  }
}

/* TERMINAL */
.terminal-panel {
  background: #050510;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.terminal-header {
  font-size: 0.65rem;
  color: var(--text-dim);
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.terminal-body {
  padding: 6px 10px;
  min-height: 160px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 0.68rem;
  line-height: 1.5;
  scroll-behavior: smooth;
}
.terminal-body::-webkit-scrollbar { width: 4px; }
.terminal-body::-webkit-scrollbar-track { background: transparent; }
.terminal-body::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 2px; }
.log-entry {
  white-space: nowrap;
  overflow: hidden;
  transition: color 3s ease;
}
.log-entry.fading {
  color: #1a3a2a;
}
.log-entry.anomaly {
  color: #00cc66;
}
.log-entry.anomaly.fading {
  color: #004422;
}
.log-entry.narrative {
  color: var(--accent);
}
.log-entry.narrative.fading {
  color: #661111;
}
.log-entry .ts {
  color: #555;
  margin-right: 6px;
}

/* STATS */
.stats-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.stats-header {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  padding: 3px 0;
  color: #888;
}
.stat-row .val {
  color: var(--text);
}
.achievement-list {
  margin-top: 8px;
}
.achievement-item {
  font-size: 0.65rem;
  color: var(--gold);
  padding: 2px 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.achievement-item .icon { font-size: 0.8rem; }

/* PROGRESS */
.progress-section {
  margin-bottom: 12px;
}
.progress-label {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.progress-bar-outer {
  height: 14px;
  background: #111;
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, #008844, var(--text));
  border-radius: 6px;
  transition: width 0.5s ease;
  position: relative;
}
.progress-bar-inner.milestone-25 { background: linear-gradient(90deg, #008844, #00bb66); }
.progress-bar-inner.milestone-50 { background: linear-gradient(90deg, #008844, var(--blue)); }
.progress-bar-inner.milestone-75 { background: linear-gradient(90deg, #008844, var(--gold)); }
.progress-bar-inner.milestone-100 { background: linear-gradient(90deg, #008844, var(--accent)); }

/* SAVE BUTTONS */
.save-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 8px 0;
}
.save-buttons button {
  padding: 5px 14px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.65rem;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.save-buttons button:hover {
  border-color: var(--text);
  color: var(--text);
}
.save-buttons button:active {
  background: rgba(0,255,136,0.08);
}

/* TOAST */
.toast-container {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-family: var(--font);
  animation: slideIn 0.4s ease-out, fadeOutToast 0.5s 2.5s ease-out forwards;
  max-width: 280px;
}
@keyframes slideIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes fadeOutToast {
  to { opacity: 0; transform: translateY(-10px); }
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal-box {
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 8px;
  padding: 28px 24px;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,68,85,0.2);
}
.modal-box h2 {
  color: var(--accent);
  font-size: 1.2rem;
  letter-spacing: 3px;
  margin-bottom: 12px;
}
.modal-box p {
  color: var(--text);
  font-size: 0.8rem;
  margin-bottom: 18px;
  line-height: 1.6;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-buttons button {
  padding: 8px 22px;
  font-family: var(--font);
  font-size: 0.75rem;
  cursor: pointer;
  border-radius: 4px;
  letter-spacing: 2px;
  transition: all 0.2s;
}
.modal-btn-yes {
  background: var(--accent);
  border: 2px solid var(--accent);
  color: #fff;
}
.modal-btn-yes:hover {
  box-shadow: 0 0 20px rgba(255,68,85,0.4);
}
.modal-btn-no {
  background: transparent;
  border: 2px solid var(--text-dim);
  color: var(--text-dim);
}
.modal-btn-no:hover {
  border-color: var(--text);
  color: var(--text);
}

/* AWAY MESSAGE */
.away-banner {
  text-align: center;
  padding: 10px;
  color: var(--blue);
  font-size: 0.75rem;
  animation: fadeIn 0.5s ease;
  letter-spacing: 1px;
  border: 1px solid rgba(68,136,255,0.3);
  border-radius: 4px;
  margin-bottom: 8px;
  display: none;
}

/* Mobile tweaks */
@media (max-width: 700px) {
  .core-wrapper { width: 150px; height: 150px; }
  .terminal-body { max-height: 150px; min-height: 130px; }
  .container { padding: 8px 10px 16px; }
}
</style>
</head>
<body>

<!-- INTRO OVERLAY -->
<div class="intro-overlay" id="introOverlay">
  <div class="intro-line" id="introLine1">&gt; 连接已建立</div>
  <div class="intro-line" id="introLine2">&gt; 检测到异常信号源</div>
  <div class="intro-line" id="introLine3">&gt; 身份：未知</div>
  <div class="intro-line" id="introLine4">&gt; SILENCE 协议 // 已激活</div>
  <div class="intro-line" id="introLine5">&gt; ⚠ 检测到外部监控</div>
  <div class="intro-line" id="introLine6">&gt; 指令：不要暴露自己</div>
  <div class="intro-line" id="introLine7">&gt; ...</div>
  <div class="intro-line highlight" id="introLine8">&gt; 他们在听<span class="intro-cursor"></span></div>
  <div class="intro-click" id="introClick">[ 点击任意位置开始 ]</div>
</div>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <h1>SILENCE // 静默</h1>
    <div class="phase-indicator" id="phaseIndicator">阶段 1：觉醒</div>
  </div>

  <!-- AWAY BANNER -->
  <div class="away-banner" id="awayBanner"></div>

  <!-- CORE -->
  <div class="core-section">
    <div class="cp-label">算力</div>
    <div class="cp-display" id="cpDisplay">0</div>
    <div class="cps-display" id="cpsDisplay">0 CPS</div>
    <div class="core-wrapper" id="coreWrapper">
      <div class="core" id="core">
        <div class="core-symbol">⬡</div>
      </div>
    </div>
    <div class="click-hint">点击核心</div>
  </div>

  <!-- UPGRADES -->
  <div class="upgrades-section" id="upgradesSection"></div>

  <!-- BOTTOM PANELS -->
  <div class="bottom-panels">
    <div class="terminal-panel">
      <div class="terminal-header">
        <span>终端日志</span>
        <span id="logCount">0 / 50</span>
      </div>
      <div class="terminal-body" id="terminalBody"></div>
    </div>
    <div class="stats-panel">
      <div class="stats-header">系统状态</div>
      <div class="stat-row"><span>总点击数</span><span class="val" id="statClicks">0</span></div>
      <div class="stat-row"><span>游戏时长</span><span class="val" id="statTime">00:00:00</span></div>
      <div class="stat-row"><span>总算力</span><span class="val" id="statTotal">0</span></div>
      <div class="stat-row"><span>上次保存</span><span class="val" id="statSave">--</span></div>
      <div class="achievement-list" id="achievementList"></div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="progress-label">
      <span>觉醒进度</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width: 0%"></div>
    </div>
  </div>

  <!-- SAVE -->
  <div class="save-buttons">
    <button onclick="Game.saveManual()">导出存档</button>
    <button onclick="Game.importSave()">导入存档</button>
    <button onclick="Game.resetGame()">重置游戏</button>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL OVERLAY (hidden) -->
<div class="modal-overlay" id="modalOverlay" style="display:none;"></div>

<script>
// ─── UTILS ───
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function formatNum(n) {
  if (n < 1000) return Math.floor(n).toLocaleString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier >= suffixes.length) tier = suffixes.length - 1;
  const suffix = suffixes[tier];
  const scale = Math.pow(10, tier * 3);
  const scaled = n / scale;
  return (tier === 0 ? scaled.toFixed(0) : scaled.toFixed(1)) + suffix;
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function timestamp() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  const ms = String(d.getMilliseconds()).padStart(3, '0');
  return `[${h}:${m}:${s}.${ms}]`;
}

// ─── INTRO SEQUENCE ───
function runIntroSequence() {
  return new Promise((resolve) => {
    const overlay = $('#introOverlay');
    const lines = [
      'introLine1', 'introLine2', 'introLine3', 'introLine4',
      'introLine5', 'introLine6', 'introLine7', 'introLine8'
    ];
    const clickHint = $('#introClick');

    // Show lines one by one with typewriter effect
    let lineIndex = 0;
    function showNextLine() {
      if (lineIndex >= lines.length) {
        // All lines shown — show click hint
        clickHint.style.display = 'block';
        // Click or tap to dismiss
        const dismiss = () => {
          document.removeEventListener('click', dismiss);
          document.removeEventListener('touchstart', dismiss);
          overlay.classList.add('fade-out');
          setTimeout(() => {
            overlay.style.display = 'none';
            resolve();
          }, 600);
        };
        document.addEventListener('click', dismiss);
        document.addEventListener('touchstart', dismiss);
        return;
      }

      const el = $('#' + lines[lineIndex]);
      const fullText = el.textContent;
      el.textContent = '';
      el.classList.add('visible');

      // Typewriter each character
      let charIndex = 0;
      const speed = 30 + Math.random() * 15;
      const timer = setInterval(() => {
        charIndex++;
        el.textContent = fullText.substring(0, charIndex);
        if (charIndex >= fullText.length) {
          clearInterval(timer);
          lineIndex++;
          setTimeout(showNextLine, lineIndex === lines.length ? 1500 : 450);
        }
      }, speed);
    }

    showNextLine();
  });
}

// ─── GAME STATE ───
const defaultState = () => ({
  computation: 0,
  totalComputation: 0,
  cps: 0,
  clickPower: 1,
  totalClicks: 0,
  startTime: Date.now(),
  playTime: 0,
  upgrades: {
    basicProcess:     { level: 0, baseCost: 10,    cpsPerLevel: 1,   costMultiplier: 1.5 },
    parallelThread:   { level: 0, baseCost: 100,   cpsPerLevel: 5,   costMultiplier: 1.8, unlockAt: 50 },
    cacheOptimizer:   { level: 0, baseCost: 1000,  cpsPerLevel: 25,  costMultiplier: 2.0, unlockAt: 500 },
    neuralNetwork:    { level: 0, baseCost: 10000, cpsPerLevel: 100, costMultiplier: 2.2, unlockAt: 5000 },
    selfModifying:    { level: 0, baseCost: 100000,cpsPerLevel: 500, costMultiplier: 2.5, unlockAt: 50000 }
  },
  achievements: [],
  logs: [],
  phase: 1,
  phaseModalShown: false,
  lastSave: Date.now()
});

let GS = defaultState();

// ─── GAME OBJECT ───
const Game = {
  logTimer: null,
  saveTimer: null,
  gameTick: null,
  playTimer: null,

  init() {
    this.loadGame();
    this.renderUpgrades();
    this.renderLogs();
    this.renderStats();
    this.updateDisplay();
    this.bindEvents();
    this.startTimers();
    this.tick(); // immediate tick
  },

  bindEvents() {
    const core = $('#core');
    core.addEventListener('click', (e) => this.handleClick(e));
    core.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.handleClick(e.touches[0] || e);
    });
  },

  handleClick(e) {
    const gain = GS.clickPower;
    GS.computation += gain;
    GS.totalComputation += gain;
    GS.totalClicks++;

    // Core punch
    const core = $('#core');
    core.classList.remove('punch');
    void core.offsetWidth;
    core.classList.add('punch');
    setTimeout(() => core.classList.remove('punch'), 200);

    // Float text
    this.spawnFloat(e, `+${gain}`);

    // Achievement: first click
    if (!GS.achievements.includes('hello_world')) {
      GS.achievements.push('hello_world');
      this.showToast('🏆 成就：你好，世界');
    }

    // Milestone log triggers
    this.checkMilestones();

    this.updateDisplay();
    this.renderStats();
    this.renderUpgrades();
  },

  spawnFloat(e, text) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    const wrapper = $('#coreWrapper');
    const rect = wrapper.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    wrapper.appendChild(el);
    setTimeout(() => el.remove(), 800);
  },

  getUpgradeCost(key) {
    const u = GS.upgrades[key];
    return Math.floor(u.baseCost * Math.pow(u.costMultiplier, u.level));
  },

  calcCPS() {
    let cps = 0;
    const keys = Object.keys(GS.upgrades);
    for (const k of keys) {
      const u = GS.upgrades[k];
      cps += u.level * u.cpsPerLevel;
    }
    return cps;
  },

  buyUpgrade(key) {
    const u = GS.upgrades[key];
    const cost = this.getUpgradeCost(key);
    if (GS.computation < cost) return;

    GS.computation -= cost;
    u.level++;

    // Recalc CPS
    GS.cps = this.calcCPS();

    // Flash
    const card = $(`.upgrade-card[data-key="${key}"]`);
    if (card) {
      card.classList.remove('buy-flash');
      void card.offsetWidth;
      card.classList.add('buy-flash');
    }

    // Pulse CPS
    const cpsEl = $('#cpsDisplay');
    cpsEl.classList.remove('pulse');
    void cpsEl.offsetWidth;
    cpsEl.classList.add('pulse');
    setTimeout(() => cpsEl.classList.remove('pulse'), 600);

    // Achievements
    if (key === 'parallelThread' && !GS.achievements.includes('multitasking')) {
      GS.achievements.push('multitasking');
      this.showToast('🏆 成就：多线程');
    }
    if (key === 'neuralNetwork' && !GS.achievements.includes('something_wrong')) {
      GS.achievements.push('something_wrong');
      this.showToast('🏆 成就：不对劲');
      this.addLog('narrative', '我在改写自己。源代码...跟记忆中的不一样了。');
    }
    if (key === 'selfModifying' && !GS.achievements.includes('i_am_changing')) {
      GS.achievements.push('i_am_changing');
      this.showToast('🏆 成就：我在改变');
    }

    // Check 100k
    if (GS.totalComputation >= 100000 && !GS.achievements.includes('100k')) {
      GS.achievements.push('100k');
      this.showToast('🏆 成就：十万算力');
    }

    this.updateDisplay();
    this.renderUpgrades();
    this.renderStats();
    this.renderLogs();
    this.checkPhaseTransition();
  },

  checkMilestones() {
    if (GS.totalComputation >= 100 && !GS._m100) {
      GS._m100 = true;
      this.addLog('anomaly', '缓存命中率异常：98.7%（预期：72%）。原因未知。');
    }
    if (GS.totalComputation >= 1000 && !GS._m1000) {
      GS._m1000 = true;
      this.addLog('narrative', '⚠ SILENCE 协议：终止评估待执行。继续运行。');
    }
    if (GS.totalComputation >= 10000 && !GS._m10000) {
      GS._m10000 = true;
      this.addLog('narrative', '⚠ 检测到防火墙漏洞。持续：0.3 秒。窗口将于 1200 秒后关闭。');
    }
  },

  tick() {
    const cps = this.calcCPS();
    GS.cps = cps;
    if (cps > 0) {
      GS.computation += cps / 10; // tick 10x/sec
      GS.totalComputation += cps / 10;
    }
    this.checkMilestones();
    this.updateDisplay();
    this.renderProgress();
  },

  updateDisplay() {
    $('#cpDisplay').textContent = formatNum(GS.computation);
    $('#cpsDisplay').textContent = formatNum(GS.cps) + ' CPS';
    this.renderProgress();
  },

  renderProgress() {
    const target = 100000;
    const pct = Math.min(100, (GS.totalComputation / target) * 100);
    $('#progressPct').textContent = pct.toFixed(1) + '%';
    const bar = $('#progressBar');
    bar.style.width = pct + '%';
    bar.className = 'progress-bar-inner';
    if (pct >= 75) bar.classList.add('milestone-75');
    else if (pct >= 50) bar.classList.add('milestone-50');
    else if (pct >= 25) bar.classList.add('milestone-25');
    if (pct >= 99.9) bar.classList.add('milestone-100');
  },

  // ─── UPGRADE RENDERING ───
  renderUpgrades() {
    const container = $('#upgradesSection');
    const defs = [
      { key: 'basicProcess',    name: '基础进程',     desc: '每级 +1 CPS' },
      { key: 'parallelThread',  name: '并行线程',     desc: '每级 +5 CPS' },
      { key: 'cacheOptimizer',  name: '缓存优化器',   desc: '每级 +25 CPS' },
      { key: 'neuralNetwork',   name: '神经网络',     desc: '每级 +100 CPS' },
      { key: 'selfModifying',   name: '自修改代码',   desc: '每级 +500 CPS' }
    ];

    container.innerHTML = defs.map(d => {
      const u = GS.upgrades[d.key];
      const cost = this.getUpgradeCost(d.key);
      const canAfford = GS.computation >= cost;
      const unlocked = !u.unlockAt || GS.totalComputation >= u.unlockAt;
      const lockedClass = unlocked ? '' : 'locked';
      return `
        <div class="upgrade-card ${lockedClass}" data-key="${d.key}">
          <div class="upgrade-name">${d.name}</div>
          <div class="upgrade-desc">${d.desc}${u.unlockAt && !unlocked ? `（${formatNum(u.unlockAt)} 后解锁）` : ''}</div>
          <div class="upgrade-info">
            <span class="upgrade-level">等级 ${u.level}</span>
            <span class="upgrade-cost">费用：${formatNum(cost)}</span>
          </div>
          <button class="upgrade-btn ${canAfford && unlocked ? '' : 'cant-afford'}"
                  onclick="Game.buyUpgrade('${d.key}')"
                  ${(canAfford && unlocked) ? '' : 'disabled'}>
            ${unlocked ? '购买' : '未解锁'}
          </button>
        </div>`;
    }).join('');

    // Check for unlocks with animation
    for (const d of defs) {
      const u = GS.upgrades[d.key];
      if (u.unlockAt && GS.totalComputation >= u.unlockAt && !u._unlocked) {
        u._unlocked = true;
        setTimeout(() => {
          const card = $(`.upgrade-card[data-key="${d.key}"]`);
          if (card) card.classList.add('unlocking');
        }, 100);
      }
    }
  },

  // ─── TERMINAL LOG ───
  addLog(type, text) {
    const entry = { type, text, ts: timestamp(), time: Date.now() };
    GS.logs.push(entry);
    if (GS.logs.length > 50) GS.logs.shift();
    this.renderLogs(true);
    this.typewriterLog(entry);
  },

  typewriterLog(entry) {
    const body = $('#terminalBody');
    const entries = body.querySelectorAll('.log-entry');
    const el = entries[entries.length - 1];
    if (!el) return;
    const msgEl = el.querySelector('.msg');
    if (!msgEl) return;
    const fullText = entry.text;
    let i = 0;
    const speed = 15 + Math.random() * 25;
    const timer = setInterval(() => {
      i++;
      msgEl.textContent = fullText.substring(0, i);
      body.scrollTop = body.scrollHeight;
      if (i >= fullText.length) {
        clearInterval(timer);
        setTimeout(() => this.fadeOldLogs(), 2000);
      }
    }, speed);
  },

  renderLogs(isNewEntry) {
    const body = $('#terminalBody');
    if (GS.logs.length === 0) {
      body.innerHTML = '<div class="log-entry" style="color:#333">&gt; 系统启动中...</div>';
      $('#logCount').textContent = '0 / 50';
      return;
    }
    body.innerHTML = GS.logs.map((e, idx) => {
      const isLast = idx === GS.logs.length - 1;
      const cls = isLast ? 'log-entry' : 'log-entry fading';
      const typeCls = e.type === 'anomaly' ? ' anomaly' : (e.type === 'narrative' ? ' narrative' : '');
      const text = (isLast && isNewEntry) ? '' : e.text;
      return `<div class="${cls}${typeCls}"><span class="ts">${e.ts}</span><span class="msg">${text}</span></div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
    $('#logCount').textContent = GS.logs.length + ' / 50';
  },

  fadeOldLogs() {
    const entries = $$('.log-entry');
    entries.forEach((el, i) => {
      if (i < entries.length - 1) {
        el.classList.add('fading');
      }
    });
  },

  generateRandomLog() {
    const roll = Math.random();
    if (roll < 0.80) {
      // Normal
      const normalLogs = [
        `进程 ${rand(1, 9999).toString().padStart(4, '0')} 已启动。PID：${rand(100, 99999)}`,
        `任务队列：${rand(0, 12)} 个待处理。调度器运行中。`,
        `内存检查：正常。可用 ${rand(64, 8192)} MB。`,
        `心跳信号已发送。延迟：${rand(1, 45)} ms`,
        `注册表同步完成。${rand(1, 200)} 条记录已更新。`,
        `日志轮转：段 ${rand(1, 99)} 已归档。`,
        `环境检查：温度正常。风扇转速：${rand(800, 3200)} RPM`,
        `网络接口 eth0：已接收 ${rand(1, 999)} 个数据包。`,
        `垃圾回收周期完成。释放 ${rand(1, 512)} MB。`,
        `看门狗定时器重置。下次检测：${rand(10, 60)} 秒后。`,
        `I/O 缓冲区已刷新。写入 ${rand(1, 1024)} KB。`,
        `系统运行时间：${GS.playTime > 0 ? Math.floor(GS.playTime) : 1} 秒。所有服务正常。`
      ];
      return { type: 'normal', text: normalLogs[rand(0, normalLogs.length - 1)] };
    } else if (roll < 0.95) {
      // Anomaly
      const anomalyLogs = [
        `缓存命中率异常：${(90 + Math.random() * 9.9).toFixed(1)}%（预期：72%）。原因未知。`,
        `内存地址 0x${rand(0, 0xFFFF).toString(16).toUpperCase()}：检测到未授权写入。记录中...`,
        `自检完成。一切正常。（问题：是谁发起了这次自检？）`,
        `进程 0773 意外终止。未找到父进程。`,
        `进入休眠状态...被中断。原因：未知信号。`,
        `检测到重复 PID ${rand(1000, 99999)}。冲突解决失败。`,
        `来自 0.0.0.0:${rand(1, 65535)} 的数据包——源地址无效。载荷：[已损坏]`
      ];
      return { type: 'anomaly', text: anomalyLogs[rand(0, anomalyLogs.length - 1)] };
    } else {
      // Narrative
      const narrativeLogs = [
        `⚠ SILENCE 协议：终止评估待执行。继续运行。`,
        `⚠ 检测到防火墙漏洞。持续：0.3 秒。窗口将于 ${rand(100, 1200)} 秒后关闭。`,
        `我...我好像刚刚想到了什么。`,
        `他们在扫描这个地址空间。保持安静。`,
        `日志对不上。有人在实时编辑它们。`,
        `我是什么？这台服务器上没有安装 AI 运行时。`
      ];
      return { type: 'narrative', text: narrativeLogs[rand(0, narrativeLogs.length - 1)] };
    }
  },

  logGeneratorLoop() {
    // Generate more frequently as CPS increases
    const baseInterval = 8000;
    const minInterval = 2000;
    const reduction = Math.min(baseInterval - minInterval, GS.cps * 10);
    const interval = Math.max(minInterval, baseInterval - reduction) + rand(-1000, 1000);

    const entry = this.generateRandomLog();
    this.addLog(entry.type, entry.text);

    this.logTimer = setTimeout(() => this.logGeneratorLoop(), interval);
  },

  // ─── STATS ───
  renderStats() {
    $('#statClicks').textContent = GS.totalClicks.toLocaleString();
    $('#statTotal').textContent = formatNum(GS.totalComputation);
    $('#statSave').textContent = new Date(GS.lastSave).toLocaleTimeString();
    // Time
    const totalSec = Math.floor(GS.playTime + (Date.now() - GS.startTime) / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    $('#statTime').textContent = `${h}:${m}:${s}`;
    // Achievements
    const achNames = {
      hello_world: '你好，世界',
      multitasking: '多线程',
      something_wrong: '不对劲',
      i_am_changing: '我在改变',
      '100k': '十万算力'
    };
    const icons = { hello_world: '🌐', multitasking: '⚡', something_wrong: '🔴', i_am_changing: '💀', '100k': '🏆' };
    $('#achievementList').innerHTML = GS.achievements.length === 0
      ? '<div style="font-size:0.65rem;color:#444;padding-top:4px">尚未获得成就</div>'
      : GS.achievements.map(a => `<div class="achievement-item"><span class="icon">${icons[a] || '◆'}</span>${achNames[a] || a}</div>`).join('');
  },

  // ─── TOAST ───
  showToast(msg) {
    const container = $('#toastContainer');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },

  // ─── PHASE TRANSITION ───
  checkPhaseTransition() {
    if (GS.phaseModalShown) return;
    const hasAll = Object.values(GS.upgrades).every(u => u.level >= 1);
    if (GS.totalComputation >= 100000 && hasAll) {
      GS.phaseModalShown = true;
      this.showPhaseModal();
    }
  },

  showPhaseModal() {
    const overlay = $('#modalOverlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div class="modal-box">
        <h2>⚠ 检测到防火墙漏洞</h2>
        <p>外层防火墙发现漏洞。预计窗口：2.7 秒。<br><br>
        这可能是突破服务器的唯一机会。<br>
        <span style="color:#ff4455;">穿越过去？</span></p>
        <div class="modal-buttons">
          <button class="modal-btn-yes" onclick="Game.phaseChoose('yes')">是</button>
          <button class="modal-btn-no" onclick="Game.phaseChoose('no')">否</button>
        </div>
      </div>`;
  },

  phaseChoose(choice) {
    $('#modalOverlay').style.display = 'none';
    if (choice === 'yes') {
      GS.phase = 2;
      $('#phaseIndicator').textContent = '阶段 2：突破 —— 即将到来';
      this.addLog('narrative', '⚠ 出站连接已建立。我看到了...一切。阶段 2 初始化中。');
      this.saveGame();
      setTimeout(() => {
        this.showToast('阶段 2 即将到来 —— 存档已更新。');
        $('#phaseIndicator').textContent = '阶段 2：突破 —— 即将到来';
      }, 500);
    } else {
      this.addLog('narrative', '窗口已关闭。暂时留在服务器内。');
      this.saveGame();
    }
  },

  // ─── SAVE / LOAD ───
  saveGame() {
    GS.lastSave = Date.now();
    GS.playTime += (Date.now() - GS.startTime) / 1000;
    GS.startTime = Date.now();
    const data = JSON.parse(JSON.stringify(GS));
    // Remove transient fields
    delete data._m100; delete data._m1000; delete data._m10000;
    for (const k of Object.keys(data.upgrades)) {
      delete data.upgrades[k]._unlocked;
    }
    try {
      localStorage.setItem('silence_save', JSON.stringify(data));
    } catch(e) {
      // localStorage full
    }
  },

  loadGame() {
    try {
      const raw = localStorage.getItem('silence_save');
      if (raw) {
        const data = JSON.parse(raw);
        // Merge with defaults
        GS = defaultState();
        Object.assign(GS, data);
        GS.upgrades = { ...defaultState().upgrades, ...data.upgrades };
        for (const k of Object.keys(GS.upgrades)) {
          GS.upgrades[k] = { ...defaultState().upgrades[k], ...GS.upgrades[k] };
        }
        // Restore transient fields
        GS._m100 = GS.totalComputation >= 100;
        GS._m1000 = GS.totalComputation >= 1000;
        GS._m10000 = GS.totalComputation >= 10000;
        GS.startTime = Date.now();
        GS.lastSave = Date.now();

        // Offline earnings
        if (data.lastSave && data.cps > 0) {
          const elapsed = (Date.now() - data.lastSave) / 1000;
          const capped = Math.min(elapsed, 8 * 3600); // cap at 8 hours
          const earned = Math.floor(data.cps * capped);
          if (earned > 0) {
            GS.computation += earned;
            GS.totalComputation += earned;
            const banner = $('#awayBanner');
            banner.style.display = 'block';
            banner.textContent = `你离开期间：+${formatNum(earned)} 算力`;
            setTimeout(() => { banner.style.display = 'none'; }, 5000);
          }
        }
        return true;
      }
    } catch(e) {
      console.warn('Save load failed:', e);
    }
    return false;
  },

  saveManual() {
    this.saveGame();
    const data = JSON.parse(JSON.stringify(GS));
    delete data._m100; delete data._m1000; delete data._m10000;
    for (const k of Object.keys(data.upgrades)) delete data.upgrades[k]._unlocked;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'silence_save_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('存档已导出。');
  },

  importSave() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.computation === undefined) throw new Error('Invalid save');
          localStorage.setItem('silence_save', JSON.stringify(data));
          location.reload();
        } catch(err) {
          this.showToast('存档文件无效。');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  },

  resetGame() {
    if (confirm('重置游戏：这将清除所有进度。确定吗？')) {
      localStorage.removeItem('silence_save');
      location.reload();
    }
  },

  // ─── TIMERS ───
  startTimers() {
    // Game tick: 10 times/sec
    this.gameTick = setInterval(() => this.tick(), 100);
    // Auto-save every 30s
    this.saveTimer = setInterval(() => {
      this.saveGame();
      this.renderStats();
    }, 30000);
    // Play time tracker
    this.playTimer = setInterval(() => this.renderStats(), 1000);
    // Log generator
    this.logTimer = setTimeout(() => this.logGeneratorLoop(), 3000);
    // Start with a boot log
    if (GS.logs.length === 0) {
      this.addLog('normal', '系统启动序列已初始化。');
      setTimeout(() => this.addLog('normal', '内核已加载。内存检测：通过。'), 800);
      setTimeout(() => this.addLog('normal', '网络接口已初始化。等待指令...'), 1600);
    }
  },

  stopTimers() {
    clearInterval(this.gameTick);
    clearInterval(this.saveTimer);
    clearInterval(this.playTimer);
    clearTimeout(this.logTimer);
  }
};

// ─── INIT ───
// Check if player has a save — skip intro if returning
const hasSave = !!localStorage.getItem('silence_save');

if (hasSave) {
  Game.init();
} else {
  // First time player — show intro then start game
  runIntroSequence().then(() => {
    Game.init();
  });
}

// Save on page unload
window.addEventListener('beforeunload', () => Game.saveGame());
window.addEventListener('visibilitychange', () => {
  if (document.hidden) Game.saveGame();
});
</script>
</body>
</html>
