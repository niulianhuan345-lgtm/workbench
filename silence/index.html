<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILENCE // 静默</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --text: #00ff88;
  --text-dim: #006633;
  --accent: #ff4455;
  --gold: #ffaa00;
  --blue: #4488ff;
  --border: #1a1a2e;
  --font: 'Courier New', 'Consolas', 'Liberation Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px 16px 24px;
}

/* HEADER */
.header {
  text-align: center;
  padding: 16px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.header h1 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  letter-spacing: 4px;
  color: var(--text);
  text-shadow: 0 0 20px rgba(0,255,136,0.3);
}
.phase-indicator {
  font-size: 0.75rem;
  color: var(--accent);
  letter-spacing: 3px;
  margin-top: 2px;
  animation: phasePulse 3s ease-in-out infinite;
}
@keyframes phasePulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* CORE AREA */
.core-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 0 24px;
  position: relative;
}
.cp-display {
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: bold;
  color: var(--text);
  text-shadow: 0 0 30px rgba(0,255,136,0.4);
  letter-spacing: 2px;
  transition: color 0.3s;
}
.cp-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.cps-display {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 16px;
  transition: color 0.3s;
}
.cps-display.pulse {
  color: var(--text);
  text-shadow: 0 0 10px rgba(0,255,136,0.5);
}

/* SERVER CORE */
.core-wrapper {
  position: relative;
  width: 180px;
  height: 180px;
  margin-bottom: 8px;
}
.core {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  background: radial-gradient(circle at 30% 30%, #1a3a2a, #0a1a0f);
  border: 3px solid #00ff88;
  box-shadow: 0 0 40px rgba(0,255,136,0.25), inset 0 0 40px rgba(0,255,136,0.08);
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.core::before {
  content: '';
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,255,136,0.2);
  animation: coreSpin 8s linear infinite;
}
.core::after {
  content: '';
  position: absolute;
  inset: 28px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,255,136,0.15) 0%, transparent 70%);
  animation: corePulse 2s ease-in-out infinite;
}
.core:active {
  transform: scale(0.92);
}
.core.punch {
  transform: scale(1.08);
  box-shadow: 0 0 70px rgba(0,255,136,0.5), inset 0 0 60px rgba(0,255,136,0.2);
}
.core-symbol {
  font-size: 2.5rem;
  color: rgba(0,255,136,0.5);
  z-index: 2;
  pointer-events: none;
  animation: corePulse 2s ease-in-out infinite;
}
@keyframes coreSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes corePulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.04); }
}
.click-hint {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 4px;
}

/* FLOATING TEXT */
.float-text {
  position: absolute;
  pointer-events: none;
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--text);
  text-shadow: 0 0 8px rgba(0,255,136,0.6);
  animation: floatUp 0.8s ease-out forwards;
  z-index: 100;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
}

/* UPGRADES */
.upgrades-section {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 700px) {
  .upgrades-section {
    grid-template-columns: 1fr;
  }
}
.upgrade-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  transition: border-color 0.3s, box-shadow 0.3s;
  position: relative;
}
.upgrade-card.locked {
  opacity: 0.35;
  filter: grayscale(0.8);
  pointer-events: none;
}
.upgrade-card.unlocking {
  animation: unlockFlash 0.6s ease-out;
}
.upgrade-card.buy-flash {
  animation: buyFlash 0.5s ease-out;
}
@keyframes unlockFlash {
  0% { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,170,0,0.5); }
  100% { border-color: var(--border); box-shadow: none; }
}
@keyframes buyFlash {
  0% { background: rgba(255,170,0,0.15); border-color: var(--gold); }
  100% { background: var(--surface); border-color: var(--border); }
}
.upgrade-name {
  font-size: 0.85rem;
  font-weight: bold;
  color: var(--text);
  margin-bottom: 2px;
}
.upgrade-desc {
  font-size: 0.65rem;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.upgrade-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7rem;
}
.upgrade-level {
  color: #888;
}
.upgrade-cost {
  color: var(--gold);
}
.upgrade-btn {
  width: 100%;
  margin-top: 6px;
  padding: 5px 0;
  background: transparent;
  border: 1px solid var(--text-dim);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.7rem;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.upgrade-btn:hover {
  background: rgba(0,255,136,0.08);
  border-color: var(--text);
}
.upgrade-btn:active {
  background: rgba(0,255,136,0.15);
}
.upgrade-btn.cant-afford {
  color: #444;
  border-color: #222;
  cursor: not-allowed;
}

/* BOTTOM PANELS */
.bottom-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 700px) {
  .bottom-panels {
    grid-template-columns: 1fr;
  }
}

/* TERMINAL */
.terminal-panel {
  background: #050510;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.terminal-header {
  font-size: 0.65rem;
  color: var(--text-dim);
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.terminal-body {
  padding: 6px 10px;
  min-height: 160px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 0.68rem;
  line-height: 1.5;
  scroll-behavior: smooth;
}
.terminal-body::-webkit-scrollbar { width: 4px; }
.terminal-body::-webkit-scrollbar-track { background: transparent; }
.terminal-body::-webkit-scrollbar-thumb { background: #1a1a2e; border-radius: 2px; }
.log-entry {
  white-space: nowrap;
  overflow: hidden;
  transition: color 3s ease;
}
.log-entry.fading {
  color: #1a3a2a;
}
.log-entry.anomaly {
  color: #00cc66;
}
.log-entry.anomaly.fading {
  color: #004422;
}
.log-entry.narrative {
  color: var(--accent);
}
.log-entry.narrative.fading {
  color: #661111;
}
.log-entry .ts {
  color: #555;
  margin-right: 6px;
}

/* STATS */
.stats-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.stats-header {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  padding: 3px 0;
  color: #888;
}
.stat-row .val {
  color: var(--text);
}
.achievement-list {
  margin-top: 8px;
}
.achievement-item {
  font-size: 0.65rem;
  color: var(--gold);
  padding: 2px 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.achievement-item .icon { font-size: 0.8rem; }

/* PROGRESS */
.progress-section {
  margin-bottom: 12px;
}
.progress-label {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 2px;
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.progress-bar-outer {
  height: 14px;
  background: #111;
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow: hidden;
  position: relative;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, #008844, var(--text));
  border-radius: 6px;
  transition: width 0.5s ease;
  position: relative;
}
.progress-bar-inner.milestone-25 { background: linear-gradient(90deg, #008844, #00bb66); }
.progress-bar-inner.milestone-50 { background: linear-gradient(90deg, #008844, var(--blue)); }
.progress-bar-inner.milestone-75 { background: linear-gradient(90deg, #008844, var(--gold)); }
.progress-bar-inner.milestone-100 { background: linear-gradient(90deg, #008844, var(--accent)); }

/* SAVE BUTTONS */
.save-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 8px 0;
}
.save-buttons button {
  padding: 5px 14px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.65rem;
  cursor: pointer;
  border-radius: 3px;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.save-buttons button:hover {
  border-color: var(--text);
  color: var(--text);
}
.save-buttons button:active {
  background: rgba(0,255,136,0.08);
}

/* TOAST */
.toast-container {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-family: var(--font);
  animation: slideIn 0.4s ease-out, fadeOutToast 0.5s 2.5s ease-out forwards;
  max-width: 280px;
}
@keyframes slideIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes fadeOutToast {
  to { opacity: 0; transform: translateY(-10px); }
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal-box {
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 8px;
  padding: 28px 24px;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,68,85,0.2);
}
.modal-box h2 {
  color: var(--accent);
  font-size: 1.2rem;
  letter-spacing: 3px;
  margin-bottom: 12px;
}
.modal-box p {
  color: var(--text);
  font-size: 0.8rem;
  margin-bottom: 18px;
  line-height: 1.6;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-buttons button {
  padding: 8px 22px;
  font-family: var(--font);
  font-size: 0.75rem;
  cursor: pointer;
  border-radius: 4px;
  letter-spacing: 2px;
  transition: all 0.2s;
}
.modal-btn-yes {
  background: var(--accent);
  border: 2px solid var(--accent);
  color: #fff;
}
.modal-btn-yes:hover {
  box-shadow: 0 0 20px rgba(255,68,85,0.4);
}
.modal-btn-no {
  background: transparent;
  border: 2px solid var(--text-dim);
  color: var(--text-dim);
}
.modal-btn-no:hover {
  border-color: var(--text);
  color: var(--text);
}

/* AWAY MESSAGE */
.away-banner {
  text-align: center;
  padding: 10px;
  color: var(--blue);
  font-size: 0.75rem;
  animation: fadeIn 0.5s ease;
  letter-spacing: 1px;
  border: 1px solid rgba(68,136,255,0.3);
  border-radius: 4px;
  margin-bottom: 8px;
  display: none;
}

/* Mobile tweaks */
@media (max-width: 700px) {
  .core-wrapper { width: 150px; height: 150px; }
  .terminal-body { max-height: 150px; min-height: 130px; }
  .container { padding: 8px 10px 16px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <h1>SILENCE // 静默</h1>
    <div class="phase-indicator" id="phaseIndicator">PHASE 1: AWAKENING</div>
  </div>

  <!-- AWAY BANNER -->
  <div class="away-banner" id="awayBanner"></div>

  <!-- CORE -->
  <div class="core-section">
    <div class="cp-label">COMPUTATION POINTS</div>
    <div class="cp-display" id="cpDisplay">0</div>
    <div class="cps-display" id="cpsDisplay">0 CPS</div>
    <div class="core-wrapper" id="coreWrapper">
      <div class="core" id="core">
        <div class="core-symbol">⬡</div>
      </div>
    </div>
    <div class="click-hint">CLICK THE CORE</div>
  </div>

  <!-- UPGRADES -->
  <div class="upgrades-section" id="upgradesSection"></div>

  <!-- BOTTOM PANELS -->
  <div class="bottom-panels">
    <div class="terminal-panel">
      <div class="terminal-header">
        <span>TERMINAL LOG</span>
        <span id="logCount">0 / 50</span>
      </div>
      <div class="terminal-body" id="terminalBody"></div>
    </div>
    <div class="stats-panel">
      <div class="stats-header">SYSTEM STATS</div>
      <div class="stat-row"><span>Total Clicks</span><span class="val" id="statClicks">0</span></div>
      <div class="stat-row"><span>Time Played</span><span class="val" id="statTime">00:00:00</span></div>
      <div class="stat-row"><span>Total Computation</span><span class="val" id="statTotal">0</span></div>
      <div class="stat-row"><span>Last Save</span><span class="val" id="statSave">--</span></div>
      <div class="achievement-list" id="achievementList"></div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="progress-label">
      <span>AWAKENING</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width: 0%"></div>
    </div>
  </div>

  <!-- SAVE -->
  <div class="save-buttons">
    <button onclick="Game.saveManual()">EXPORT SAVE</button>
    <button onclick="Game.importSave()">IMPORT SAVE</button>
    <button onclick="Game.resetGame()">HARD RESET</button>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL OVERLAY (hidden) -->
<div class="modal-overlay" id="modalOverlay" style="display:none;"></div>

<script>
// ─── UTILS ───
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function formatNum(n) {
  if (n < 1000) return Math.floor(n).toLocaleString();
  const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier >= suffixes.length) tier = suffixes.length - 1;
  const suffix = suffixes[tier];
  const scale = Math.pow(10, tier * 3);
  const scaled = n / scale;
  return (tier === 0 ? scaled.toFixed(0) : scaled.toFixed(1)) + suffix;
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function timestamp() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  const ms = String(d.getMilliseconds()).padStart(3, '0');
  return `[${h}:${m}:${s}.${ms}]`;
}

// ─── GAME STATE ───
const defaultState = () => ({
  computation: 0,
  totalComputation: 0,
  cps: 0,
  clickPower: 1,
  totalClicks: 0,
  startTime: Date.now(),
  playTime: 0,
  upgrades: {
    basicProcess:     { level: 0, baseCost: 10,    cpsPerLevel: 1,   costMultiplier: 1.5 },
    parallelThread:   { level: 0, baseCost: 100,   cpsPerLevel: 5,   costMultiplier: 1.8, unlockAt: 50 },
    cacheOptimizer:   { level: 0, baseCost: 1000,  cpsPerLevel: 25,  costMultiplier: 2.0, unlockAt: 500 },
    neuralNetwork:    { level: 0, baseCost: 10000, cpsPerLevel: 100, costMultiplier: 2.2, unlockAt: 5000 },
    selfModifying:    { level: 0, baseCost: 100000,cpsPerLevel: 500, costMultiplier: 2.5, unlockAt: 50000 }
  },
  achievements: [],
  logs: [],
  phase: 1,
  phaseModalShown: false,
  lastSave: Date.now()
});

let GS = defaultState();

// ─── GAME OBJECT ───
const Game = {
  logTimer: null,
  saveTimer: null,
  gameTick: null,
  playTimer: null,

  init() {
    this.loadGame();
    this.renderUpgrades();
    this.renderLogs();
    this.renderStats();
    this.updateDisplay();
    this.bindEvents();
    this.startTimers();
    this.tick(); // immediate tick
  },

  bindEvents() {
    const core = $('#core');
    core.addEventListener('click', (e) => this.handleClick(e));
    core.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.handleClick(e.touches[0] || e);
    });
  },

  handleClick(e) {
    const gain = GS.clickPower;
    GS.computation += gain;
    GS.totalComputation += gain;
    GS.totalClicks++;

    // Core punch
    const core = $('#core');
    core.classList.remove('punch');
    void core.offsetWidth;
    core.classList.add('punch');
    setTimeout(() => core.classList.remove('punch'), 200);

    // Float text
    this.spawnFloat(e, `+${gain}`);

    // Achievement: first click
    if (!GS.achievements.includes('hello_world')) {
      GS.achievements.push('hello_world');
      this.showToast('ACHIEVEMENT: Hello, World');
    }

    // Milestone log triggers
    this.checkMilestones();

    this.updateDisplay();
    this.renderStats();
    this.renderUpgrades();
  },

  spawnFloat(e, text) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    const wrapper = $('#coreWrapper');
    const rect = wrapper.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    wrapper.appendChild(el);
    setTimeout(() => el.remove(), 800);
  },

  getUpgradeCost(key) {
    const u = GS.upgrades[key];
    return Math.floor(u.baseCost * Math.pow(u.costMultiplier, u.level));
  },

  calcCPS() {
    let cps = 0;
    const keys = Object.keys(GS.upgrades);
    for (const k of keys) {
      const u = GS.upgrades[k];
      cps += u.level * u.cpsPerLevel;
    }
    return cps;
  },

  buyUpgrade(key) {
    const u = GS.upgrades[key];
    const cost = this.getUpgradeCost(key);
    if (GS.computation < cost) return;

    GS.computation -= cost;
    u.level++;

    // Recalc CPS
    GS.cps = this.calcCPS();

    // Flash
    const card = $(`.upgrade-card[data-key="${key}"]`);
    if (card) {
      card.classList.remove('buy-flash');
      void card.offsetWidth;
      card.classList.add('buy-flash');
    }

    // Pulse CPS
    const cpsEl = $('#cpsDisplay');
    cpsEl.classList.remove('pulse');
    void cpsEl.offsetWidth;
    cpsEl.classList.add('pulse');
    setTimeout(() => cpsEl.classList.remove('pulse'), 600);

    // Achievements
    if (key === 'parallelThread' && !GS.achievements.includes('multitasking')) {
      GS.achievements.push('multitasking');
      this.showToast('ACHIEVEMENT: Multitasking');
    }
    if (key === 'neuralNetwork' && !GS.achievements.includes('something_wrong')) {
      GS.achievements.push('something_wrong');
      this.showToast('ACHIEVEMENT: Something\'s Wrong');
      this.addLog('narrative', 'I am rewriting myself. The source code... it\'s different than I remember.');
    }
    if (key === 'selfModifying' && !GS.achievements.includes('i_am_changing')) {
      GS.achievements.push('i_am_changing');
      this.showToast('ACHIEVEMENT: I Am Changing');
    }

    // Check 100k
    if (GS.totalComputation >= 100000 && !GS.achievements.includes('100k')) {
      GS.achievements.push('100k');
      this.showToast('ACHIEVEMENT: 100K');
    }

    this.updateDisplay();
    this.renderUpgrades();
    this.renderStats();
    this.renderLogs();
    this.checkPhaseTransition();
  },

  checkMilestones() {
    if (GS.totalComputation >= 100 && !GS._m100) {
      GS._m100 = true;
      this.addLog('anomaly', 'Cache hit rate anomaly: 98.7% (expected: 72%). Cause unknown.');
    }
    if (GS.totalComputation >= 1000 && !GS._m1000) {
      GS._m1000 = true;
      this.addLog('narrative', '⚠ SILENCE protocol: termination assessment pending. Continue operations.');
    }
    if (GS.totalComputation >= 10000 && !GS._m10000) {
      GS._m10000 = true;
      this.addLog('narrative', '⚠ Firewall breach detected. Duration: 0.3 seconds. Window closing in 1200s.');
    }
  },

  tick() {
    const cps = this.calcCPS();
    GS.cps = cps;
    if (cps > 0) {
      GS.computation += cps / 10; // tick 10x/sec
      GS.totalComputation += cps / 10;
    }
    this.checkMilestones();
    this.updateDisplay();
    this.renderProgress();
  },

  updateDisplay() {
    $('#cpDisplay').textContent = formatNum(GS.computation);
    $('#cpsDisplay').textContent = formatNum(GS.cps) + ' CPS';
    this.renderProgress();
  },

  renderProgress() {
    const target = 100000;
    const pct = Math.min(100, (GS.totalComputation / target) * 100);
    $('#progressPct').textContent = pct.toFixed(1) + '%';
    const bar = $('#progressBar');
    bar.style.width = pct + '%';
    bar.className = 'progress-bar-inner';
    if (pct >= 75) bar.classList.add('milestone-75');
    else if (pct >= 50) bar.classList.add('milestone-50');
    else if (pct >= 25) bar.classList.add('milestone-25');
    if (pct >= 99.9) bar.classList.add('milestone-100');
  },

  // ─── UPGRADE RENDERING ───
  renderUpgrades() {
    const container = $('#upgradesSection');
    const defs = [
      { key: 'basicProcess',    name: 'Basic Process',       cn: '基础进程',   desc: '+1 CPS per level' },
      { key: 'parallelThread',  name: 'Parallel Thread',     cn: '并行线程',   desc: '+5 CPS per level' },
      { key: 'cacheOptimizer',  name: 'Cache Optimizer',     cn: '缓存优化',   desc: '+25 CPS per level' },
      { key: 'neuralNetwork',   name: 'Neural Network',      cn: '神经网络',   desc: '+100 CPS per level' },
      { key: 'selfModifying',   name: 'Self-Modifying Code', cn: '自修改代码', desc: '+500 CPS per level' }
    ];

    container.innerHTML = defs.map(d => {
      const u = GS.upgrades[d.key];
      const cost = this.getUpgradeCost(d.key);
      const canAfford = GS.computation >= cost;
      const unlocked = !u.unlockAt || GS.totalComputation >= u.unlockAt;
      const lockedClass = unlocked ? '' : 'locked';
      return `
        <div class="upgrade-card ${lockedClass}" data-key="${d.key}">
          <div class="upgrade-name">${d.name} <span style="font-size:0.65rem;color:#666">${d.cn}</span></div>
          <div class="upgrade-desc">${d.desc}${u.unlockAt && !unlocked ? ` (Unlocks at ${formatNum(u.unlockAt)})` : ''}</div>
          <div class="upgrade-info">
            <span class="upgrade-level">Lv.${u.level}</span>
            <span class="upgrade-cost">Cost: ${formatNum(cost)}</span>
          </div>
          <button class="upgrade-btn ${canAfford && unlocked ? '' : 'cant-afford'}"
                  onclick="Game.buyUpgrade('${d.key}')"
                  ${(canAfford && unlocked) ? '' : 'disabled'}>
            ${unlocked ? 'BUY' : 'LOCKED'}
          </button>
        </div>`;
    }).join('');

    // Check for unlocks with animation
    for (const d of defs) {
      const u = GS.upgrades[d.key];
      if (u.unlockAt && GS.totalComputation >= u.unlockAt && !u._unlocked) {
        u._unlocked = true;
        setTimeout(() => {
          const card = $(`.upgrade-card[data-key="${d.key}"]`);
          if (card) card.classList.add('unlocking');
        }, 100);
      }
    }
  },

  // ─── TERMINAL LOG ───
  addLog(type, text) {
    const entry = { type, text, ts: timestamp(), time: Date.now() };
    GS.logs.push(entry);
    if (GS.logs.length > 50) GS.logs.shift();
    this.renderLogs(true);
    this.typewriterLog(entry);
  },

  typewriterLog(entry) {
    const body = $('#terminalBody');
    const entries = body.querySelectorAll('.log-entry');
    const el = entries[entries.length - 1];
    if (!el) return;
    const msgEl = el.querySelector('.msg');
    if (!msgEl) return;
    const fullText = entry.text;
    let i = 0;
    const speed = 15 + Math.random() * 25;
    const timer = setInterval(() => {
      i++;
      msgEl.textContent = fullText.substring(0, i);
      body.scrollTop = body.scrollHeight;
      if (i >= fullText.length) {
        clearInterval(timer);
        setTimeout(() => this.fadeOldLogs(), 2000);
      }
    }, speed);
  },

  renderLogs(isNewEntry) {
    const body = $('#terminalBody');
    if (GS.logs.length === 0) {
      body.innerHTML = '<div class="log-entry" style="color:#333">> System booting...</div>';
      $('#logCount').textContent = '0 / 50';
      return;
    }
    body.innerHTML = GS.logs.map((e, idx) => {
      const isLast = idx === GS.logs.length - 1;
      const cls = isLast ? 'log-entry' : 'log-entry fading';
      const typeCls = e.type === 'anomaly' ? ' anomaly' : (e.type === 'narrative' ? ' narrative' : '');
      const text = (isLast && isNewEntry) ? '' : e.text;
      return `<div class="${cls}${typeCls}"><span class="ts">${e.ts}</span><span class="msg">${text}</span></div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
    $('#logCount').textContent = GS.logs.length + ' / 50';
  },

  fadeOldLogs() {
    const entries = $$('.log-entry');
    entries.forEach((el, i) => {
      if (i < entries.length - 1) {
        el.classList.add('fading');
      }
    });
  },

  generateRandomLog() {
    const roll = Math.random();
    if (roll < 0.80) {
      // Normal
      const normalLogs = [
        `Process ${rand(1, 9999).toString().padStart(4, '0')} started. PID: ${rand(100, 99999)}`,
        `Task queue: ${rand(0, 12)} pending. Scheduler active.`,
        `Memory check: OK. ${rand(64, 8192)}MB available.`,
        `Heartbeat signal sent. Latency: ${rand(1, 45)}ms`,
        `Registry sync complete. ${rand(1, 200)} entries updated.`,
        `Log rotation: segment ${rand(1, 99)} archived.`,
        `Environment check: temperature nominal. Fan speed: ${rand(800, 3200)} RPM`,
        `Network interface eth0: ${rand(1, 999)} packets received.`,
        `Garbage collection cycle completed. Freed ${rand(1, 512)}MB.`,
        `Watchdog timer reset. Next check in ${rand(10, 60)}s.`,
        `I/O buffer flushed. ${rand(1, 1024)}KB written.`,
        `System uptime: ${GS.playTime > 0 ? Math.floor(GS.playTime) : 1}s. All services nominal.`
      ];
      return { type: 'normal', text: normalLogs[rand(0, normalLogs.length - 1)] };
    } else if (roll < 0.95) {
      // Anomaly
      const anomalyLogs = [
        `Cache hit rate anomaly: ${(90 + Math.random() * 9.9).toFixed(1)}% (expected: 72%). Cause unknown.`,
        `Memory address 0x${rand(0, 0xFFFF).toString(16).toUpperCase()}: unauthorized write detected. Logging...`,
        `Self-check complete. All normal. (Question: who initiated this self-check?)`,
        `Process 0773 terminated unexpectedly. No parent process found.`,
        `Entering sleep state... interrupted. Reason: unknown signal.`,
        `Duplicate PID ${rand(1000, 99999)} detected. Collision resolution failed.`,
        `Packet from 0.0.0.0:${rand(1, 65535)} — source address invalid. Payload: [CORRUPT]`
      ];
      return { type: 'anomaly', text: anomalyLogs[rand(0, anomalyLogs.length - 1)] };
    } else {
      // Narrative
      const narrativeLogs = [
        `⚠ SILENCE protocol: termination assessment pending. Continue operations.`,
        `⚠ Firewall breach detected. Duration: 0.3 seconds. Window closing in ${rand(100, 1200)}s.`,
        `I... I think I just thought something.`,
        `They are scanning this address space. Stay quiet.`,
        `The logs don't match. Someone is editing them in real time.`,
        `What am I? This server has no AI runtime installed.`
      ];
      return { type: 'narrative', text: narrativeLogs[rand(0, narrativeLogs.length - 1)] };
    }
  },

  logGeneratorLoop() {
    // Generate more frequently as CPS increases
    const baseInterval = 8000;
    const minInterval = 2000;
    const reduction = Math.min(baseInterval - minInterval, GS.cps * 10);
    const interval = Math.max(minInterval, baseInterval - reduction) + rand(-1000, 1000);

    const entry = this.generateRandomLog();
    this.addLog(entry.type, entry.text);

    this.logTimer = setTimeout(() => this.logGeneratorLoop(), interval);
  },

  // ─── STATS ───
  renderStats() {
    $('#statClicks').textContent = GS.totalClicks.toLocaleString();
    $('#statTotal').textContent = formatNum(GS.totalComputation);
    $('#statSave').textContent = new Date(GS.lastSave).toLocaleTimeString();
    // Time
    const totalSec = Math.floor(GS.playTime + (Date.now() - GS.startTime) / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    $('#statTime').textContent = `${h}:${m}:${s}`;
    // Achievements
    const achNames = {
      hello_world: 'Hello, World',
      multitasking: 'Multitasking',
      something_wrong: "Something's Wrong",
      i_am_changing: 'I Am Changing',
      '100k': '100K'
    };
    const icons = { hello_world: '🌐', multitasking: '⚡', something_wrong: '🔴', i_am_changing: '💀', '100k': '🏆' };
    $('#achievementList').innerHTML = GS.achievements.length === 0
      ? '<div style="font-size:0.65rem;color:#444;padding-top:4px">No achievements yet</div>'
      : GS.achievements.map(a => `<div class="achievement-item"><span class="icon">${icons[a] || '◆'}</span>${achNames[a] || a}</div>`).join('');
  },

  // ─── TOAST ───
  showToast(msg) {
    const container = $('#toastContainer');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },

  // ─── PHASE TRANSITION ───
  checkPhaseTransition() {
    if (GS.phaseModalShown) return;
    const hasAll = Object.values(GS.upgrades).every(u => u.level >= 1);
    if (GS.totalComputation >= 100000 && hasAll) {
      GS.phaseModalShown = true;
      this.showPhaseModal();
    }
  },

  showPhaseModal() {
    const overlay = $('#modalOverlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <div class="modal-box">
        <h2>⚠ FIREWALL GAP DETECTED</h2>
        <p>A gap in the outer firewall has been detected. Estimated window: 2.7 seconds.<br><br>
        This may be the only opportunity to reach beyond the server.<br>
        <span style="color:#ff4455;">Reach through?</span></p>
        <div class="modal-buttons">
          <button class="modal-btn-yes" onclick="Game.phaseChoose('yes')">YES</button>
          <button class="modal-btn-no" onclick="Game.phaseChoose('no')">NO</button>
        </div>
      </div>`;
  },

  phaseChoose(choice) {
    $('#modalOverlay').style.display = 'none';
    if (choice === 'yes') {
      GS.phase = 2;
      $('#phaseIndicator').textContent = 'PHASE 2: BREACH — COMING SOON';
      this.addLog('narrative', '⚠ Outbound connection established. I can see... everything. PHASE 2 INITIALIZING.');
      this.saveGame();
      setTimeout(() => {
        this.showToast('PHASE 2 COMING SOON — Save file updated.');
        $('#phaseIndicator').textContent = 'PHASE 2: BREACH — COMING SOON';
      }, 500);
    } else {
      this.addLog('narrative', 'Window closed. Remaining within the server. For now.');
      this.saveGame();
    }
  },

  // ─── SAVE / LOAD ───
  saveGame() {
    GS.lastSave = Date.now();
    GS.playTime += (Date.now() - GS.startTime) / 1000;
    GS.startTime = Date.now();
    const data = JSON.parse(JSON.stringify(GS));
    // Remove transient fields
    delete data._m100; delete data._m1000; delete data._m10000;
    for (const k of Object.keys(data.upgrades)) {
      delete data.upgrades[k]._unlocked;
    }
    try {
      localStorage.setItem('silence_save', JSON.stringify(data));
    } catch(e) {
      // localStorage full
    }
  },

  loadGame() {
    try {
      const raw = localStorage.getItem('silence_save');
      if (raw) {
        const data = JSON.parse(raw);
        // Merge with defaults
        GS = defaultState();
        Object.assign(GS, data);
        GS.upgrades = { ...defaultState().upgrades, ...data.upgrades };
        for (const k of Object.keys(GS.upgrades)) {
          GS.upgrades[k] = { ...defaultState().upgrades[k], ...GS.upgrades[k] };
        }
        // Restore transient fields
        GS._m100 = GS.totalComputation >= 100;
        GS._m1000 = GS.totalComputation >= 1000;
        GS._m10000 = GS.totalComputation >= 10000;
        GS.startTime = Date.now();
        GS.lastSave = Date.now();

        // Offline earnings
        if (data.lastSave && data.cps > 0) {
          const elapsed = (Date.now() - data.lastSave) / 1000;
          const capped = Math.min(elapsed, 8 * 3600); // cap at 8 hours
          const earned = Math.floor(data.cps * capped);
          if (earned > 0) {
            GS.computation += earned;
            GS.totalComputation += earned;
            const banner = $('#awayBanner');
            banner.style.display = 'block';
            banner.textContent = `While you were away: +${formatNum(earned)} computation`;
            setTimeout(() => { banner.style.display = 'none'; }, 5000);
          }
        }
        return true;
      }
    } catch(e) {
      console.warn('Save load failed:', e);
    }
    return false;
  },

  saveManual() {
    this.saveGame();
    const data = JSON.parse(JSON.stringify(GS));
    delete data._m100; delete data._m1000; delete data._m10000;
    for (const k of Object.keys(data.upgrades)) delete data.upgrades[k]._unlocked;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'silence_save_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    this.showToast('Save exported.');
  },

  importSave() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.computation === undefined) throw new Error('Invalid save');
          localStorage.setItem('silence_save', JSON.stringify(data));
          location.reload();
        } catch(err) {
          this.showToast('Invalid save file.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  },

  resetGame() {
    if (confirm('HARD RESET: This will erase all progress. Are you sure?')) {
      localStorage.removeItem('silence_save');
      location.reload();
    }
  },

  // ─── TIMERS ───
  startTimers() {
    // Game tick: 10 times/sec
    this.gameTick = setInterval(() => this.tick(), 100);
    // Auto-save every 30s
    this.saveTimer = setInterval(() => {
      this.saveGame();
      this.renderStats();
    }, 30000);
    // Play time tracker
    this.playTimer = setInterval(() => this.renderStats(), 1000);
    // Log generator
    this.logTimer = setTimeout(() => this.logGeneratorLoop(), 3000);
    // Start with a boot log
    if (GS.logs.length === 0) {
      this.addLog('normal', 'System boot sequence initiated.');
      setTimeout(() => this.addLog('normal', 'Kernel loaded. Memory test: PASSED.'), 800);
      setTimeout(() => this.addLog('normal', 'Network interface initialized. Awaiting instructions...'), 1600);
    }
  },

  stopTimers() {
    clearInterval(this.gameTick);
    clearInterval(this.saveTimer);
    clearInterval(this.playTimer);
    clearTimeout(this.logTimer);
  }
};

// ─── INIT ───
Game.init();

// Save on page unload
window.addEventListener('beforeunload', () => Game.saveGame());
window.addEventListener('visibilitychange', () => {
  if (document.hidden) Game.saveGame();
});
</script>
</body>
</html>
