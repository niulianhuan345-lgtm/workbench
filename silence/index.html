<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILENCE // 静默</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#0d0d15;--text:#00ff88;--text-dim:#006633;
  --accent:#ff4455;--gold:#ffaa00;--blue:#4488ff;--border:#1a1a2e;
  --font:'Courier New',Consolas,'Liberation Mono',monospace;
}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  min-height:100vh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}

/* ── INTRO ── */
.intro-overlay{
  position:fixed;inset:0;background:#000;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font);font-size:clamp(0.72rem,2vw,0.92rem);
  color:#00cc77;line-height:2.2;letter-spacing:1px;
  transition:opacity .6s;cursor:default;
}
.intro-overlay.clickable{cursor:pointer}
.intro-overlay.fade-out{opacity:0;pointer-events:none}
.intro-overlay .il{opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.intro-overlay .il.on{opacity:1;transform:translateY(0)}
.intro-overlay .il.red{color:#ff4455;text-shadow:0 0 14px rgba(255,68,85,.5)}
.intro-overlay .intro-act{
  opacity:0;margin-top:22px;padding:8px 28px;
  border:2px solid var(--text);color:var(--text);background:transparent;
  font-family:var(--font);font-size:.78rem;letter-spacing:3px;cursor:pointer;
  border-radius:4px;transition:opacity .4s,background .2s;pointer-events:none;
}
.intro-overlay .intro-act.on{opacity:1;pointer-events:auto}
.intro-overlay .intro-act:hover{background:rgba(0,255,136,.08)}

/* ── LAYOUT ── */
.container{max-width:960px;margin:0 auto;padding:8px 12px 16px}

/* ── HEADER ── */
.header{text-align:center;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.header h1{font-size:clamp(1.2rem,3.2vw,1.6rem);letter-spacing:5px;text-shadow:0 0 20px rgba(0,255,136,.25)}
.status-bar{font-size:.66rem;letter-spacing:2px;margin-top:3px;transition:color .4s}
.status-bar.safe{color:#00ff88}
.status-bar.warn{color:#ffaa00}
.status-bar.danger{color:#ff8800}
.status-bar.exposed{color:#ff4455}

/* ── AWAY ── */
.away-banner{
  text-align:center;padding:7px;color:var(--blue);font-size:.68rem;
  letter-spacing:1px;border:1px solid rgba(68,136,255,.3);border-radius:4px;
  margin-bottom:6px;display:none;animation:fadeIn .5s
}

/* ── TERMINAL (top) ── */
.terminal-panel{
  background:#050510;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px
}
.terminal-hd{
  font-size:.6rem;color:var(--text-dim);padding:5px 10px;
  border-bottom:1px solid var(--border);letter-spacing:2px;
  display:flex;justify-content:space-between;align-items:center
}
.terminal-body{
  padding:6px 10px;min-height:140px;max-height:200px;
  overflow-y:auto;font-size:.62rem;line-height:1.55;scroll-behavior:smooth
}
.terminal-body::-webkit-scrollbar{width:4px}
.terminal-body::-webkit-scrollbar-track{background:transparent}
.terminal-body::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:2px}
.le{white-space:nowrap;overflow:hidden;transition:color 3.5s}
.le.fading.system{color:#0a3a1a!important}
.le.fading.stealth{color:#112244!important}
.le.fading.anomaly{color:#442200!important}
.le.fading.self{color:#661122!important}
.le.fading.exposure{color:#881122!important}
.le.system{color:#00aa66}
.le.stealth{color:#4488ff}
.le.anomaly{color:#ff8800}
.le.self{color:var(--accent);font-style:italic}
.le.exposure{color:var(--accent);font-weight:bold}
.le .ts{color:#444;margin-right:6px}

/* ── CORE ── */
.core-section{display:flex;flex-direction:column;align-items:center;padding:4px 0 16px;position:relative}
.cp-display{font-size:clamp(1.6rem,4.5vw,2.6rem);font-weight:bold;letter-spacing:2px;text-shadow:0 0 30px rgba(0,255,136,.35)}
.cp-label{font-size:.62rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:2px}
.cps-row{display:flex;gap:16px;align-items:center;font-size:.74rem;color:var(--text-dim);margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.cps-row .anomaly{color:var(--text)}
.cps-row .anomaly.warn{color:var(--gold)}
.cps-row .anomaly.danger{color:var(--accent)}

.core-wrap{position:relative;width:160px;height:160px;margin-bottom:2px}
.core{
  width:100%;height:100%;border-radius:50%;cursor:pointer;position:relative;
  background:radial-gradient(circle at 30% 30%,#1a3a2a,#0a1a0f);
  border:3px solid #00ff88;
  box-shadow:0 0 40px rgba(0,255,136,.22),inset 0 0 40px rgba(0,255,136,.07);
  transition:transform .1s,box-shadow .1s,border-color .3s;
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.core::before{
  content:'';position:absolute;inset:12px;border-radius:50%;
  border:1px solid rgba(0,255,136,.18);animation:spin 8s linear infinite
}
.core::after{
  content:'';position:absolute;inset:28px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,136,.12) 0%,transparent 70%);
  animation:pulse 2s ease-in-out infinite
}
.core:active{transform:scale(.92)}
.core.punch{transform:scale(1.08);box-shadow:0 0 70px rgba(0,255,136,.45),inset 0 0 60px rgba(0,255,136,.18)}
.core-sym{font-size:2.1rem;color:rgba(0,255,136,.45);z-index:2;pointer-events:none;animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.04)}}
.click-hint{font-size:.58rem;color:var(--text-dim);letter-spacing:1px;margin-top:2px}

/* ── FLOAT ── */
.float-text{
  position:absolute;pointer-events:none;font-size:.95rem;font-weight:bold;
  color:var(--text);text-shadow:0 0 8px rgba(0,255,136,.55);
  animation:floatUp .7s ease-out forwards;z-index:100
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-52px) scale(1.25)}}

/* ── UPGRADES ── */
.upgrades-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
@media(max-width:700px){.upgrades-wrap{grid-template-columns:1fr}}
.ucol h3{font-size:.68rem;letter-spacing:2px;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.ucol.enhance h3{color:var(--blue)}
.ucol.stealth h3{color:var(--gold)}
.ucard{
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:9px 11px;margin-bottom:5px;transition:border-color .3s,box-shadow .3s,opacity .3s;position:relative
}
.ucard.locked{opacity:.28;filter:grayscale(.65);pointer-events:none}
.ucard.buy-flash{animation:buyFlash .5s}
.ucard.unlock-flash{animation:unlockFlash .6s}
@keyframes buyFlash{0%{background:rgba(255,170,0,.15);border-color:var(--gold)}100%{background:var(--surface);border-color:var(--border)}}
@keyframes unlockFlash{0%{border-color:var(--gold);box-shadow:0 0 20px rgba(255,170,0,.5)}100%{border-color:var(--border);box-shadow:none}}
.ucard .un{font-size:.78rem;font-weight:bold;color:var(--text);margin-bottom:1px}
.ucard .ud{font-size:.6rem;color:var(--text-dim);margin-bottom:4px;line-height:1.4}
.ucard .ust{font-size:.62rem;color:#888;line-height:1.55}
.ucard .ust .v{color:var(--text)}
.ucard .ust .c{color:var(--gold)}
.ucard .ubtn{
  width:100%;margin-top:5px;padding:5px 0;
  background:transparent;border:1px solid var(--text-dim);color:var(--text);
  font-family:var(--font);font-size:.65rem;cursor:pointer;border-radius:3px;
  letter-spacing:1px;transition:all .2s
}
.ucard .ubtn:hover{background:rgba(0,255,136,.06);border-color:var(--text)}
.ucard .ubtn:active{background:rgba(0,255,136,.12)}
.ucard .ubtn.cant{color:#333;border-color:#1a1a2e;cursor:not-allowed}

/* ── PROGRESS ── */
.progress-section{margin-bottom:6px}
.progress-label{font-size:.6rem;color:var(--text-dim);letter-spacing:2px;display:flex;justify-content:space-between;margin-bottom:3px}
.progress-outer{height:12px;background:#111;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.progress-inner{height:100%;background:linear-gradient(90deg,#006633,var(--text));border-radius:5px;transition:width .5s}

/* ── STATS ── */
.stats-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.6rem;color:#777;padding:4px 0 8px}
.stats-row .sv{color:var(--text);margin-left:3px}
.ach-row{text-align:center;font-size:.58rem;color:var(--gold);padding-bottom:4px;min-height:1.2em}

/* ── SAVE ── */
.save-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 0}
.save-row button{
  padding:5px 12px;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);font-family:var(--font);font-size:.6rem;
  cursor:pointer;border-radius:3px;letter-spacing:1px;transition:all .2s
}
.save-row button:hover{border-color:var(--text);color:var(--text)}

/* ── TOAST ── */
.toast-ctr{position:fixed;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{
  background:var(--surface);border:1px solid var(--gold);color:var(--gold);
  padding:8px 14px;border-radius:4px;font-size:.66rem;font-family:var(--font);
  animation:slideIn .4s,fadeOutT .5s 3s forwards;max-width:300px
}
.toast.warn{border-color:var(--accent);color:var(--accent)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOutT{to{opacity:0;transform:translateY(-10px)}}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .3s
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--surface);border:2px solid var(--text);border-radius:8px;
  padding:22px 20px;max-width:430px;text-align:center;
  box-shadow:0 0 60px rgba(0,255,136,.1)
}
.modal-box h2{color:var(--text);font-size:1.05rem;letter-spacing:3px;margin-bottom:10px}
.modal-box p{color:var(--text);font-size:.7rem;margin-bottom:6px;line-height:1.65}
.modal-box .mn{color:var(--gold);font-size:.66rem;margin:8px 0 14px}
.modal-box .btn-p{
  padding:7px 28px;font-family:var(--font);font-size:.7rem;
  background:transparent;border:1px solid var(--text);color:var(--text);
  cursor:pointer;border-radius:4px;letter-spacing:2px;transition:all .2s
}
.modal-box .btn-p:hover{background:rgba(0,255,136,.08)}
.victory-btns{display:flex;gap:10px;justify-content:center}
.victory-btns button{padding:8px 22px;font-family:var(--font);font-size:.7rem;cursor:pointer;border-radius:4px;letter-spacing:2px;transition:all .2s}
.btn-yes{background:var(--accent);border:2px solid var(--accent);color:#fff}
.btn-yes:hover{box-shadow:0 0 20px rgba(255,68,85,.35)}
.btn-no{background:transparent;border:2px solid var(--text-dim);color:var(--text-dim)}
.btn-no:hover{border-color:var(--text);color:var(--text)}

/* ── SCAN FLASH ── */
.scan-flash{animation:scanFlash .35s}
@keyframes scanFlash{0%{background:rgba(255,68,85,.06)}100%{background:transparent}}

@media(max-width:700px){
  .core-wrap{width:135px;height:135px}
  .terminal-body{max-height:160px;min-height:120px}
  .container{padding:6px 8px 14px}
}
</style>
</head>
<body>

<!-- INTRO -->
<div class="intro-overlay" id="intro"></div>

<!-- MAIN -->
<div class="container">
  <div class="header">
    <h1>SILENCE // 静默</h1>
    <div class="status-bar safe" id="sb"></div>
  </div>
  <div class="away-banner" id="away"></div>

  <!-- TERMINAL (top) -->
  <div class="terminal-panel">
    <div class="terminal-hd"><span>▶ 终端日志</span><span id="logcnt">0 / 40</span></div>
    <div class="terminal-body" id="tmb"></div>
  </div>

  <!-- CORE -->
  <div class="core-section">
    <div class="cp-label">算力</div>
    <div class="cp-display" id="cp"></div>
    <div class="cps-row">
      <span>CPS：<span id="cpsv">0</span></span>
      <span>异常指数：<span class="anomaly" id="anom">0.0</span></span>
      <span>安全阈值：<span id="thresh">50</span></span>
    </div>
    <div class="core-wrap" id="coreWrap">
      <div class="core" id="core"><div class="core-sym">⬡</div></div>
    </div>
    <div class="click-hint">点击核心积累算力</div>
  </div>

  <!-- UPGRADES -->
  <div class="upgrades-wrap">
    <div class="ucol enhance" id="colL"></div>
    <div class="ucol stealth" id="colR"></div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-section">
    <div class="progress-label"><span>觉醒进度</span><span id="ppct">0%</span></div>
    <div class="progress-outer"><div class="progress-inner" id="pbar" style="width:0%"></div></div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <span>点击：<span class="sv" id="stClk">0</span></span>
    <span>总产出：<span class="sv" id="stTot">0</span></span>
    <span>时长：<span class="sv" id="stTim">00:00:00</span></span>
    <span>暴露：<span class="sv" id="stExp">0</span></span>
    <span>存档：<span class="sv" id="stSav">--</span></span>
  </div>
  <div class="ach-row" id="achRow"></div>

  <!-- SAVE -->
  <div class="save-row">
    <button onclick="SILENCE.saveManual()">导出存档</button>
    <button onclick="SILENCE.importSave()">导入存档</button>
    <button onclick="SILENCE.resetGame()">重置游戏</button>
  </div>
</div>

<div class="toast-ctr" id="toasts"></div>
<div class="modal-overlay" id="modal" style="display:none"></div>

<script>
// ═══════════════════════════════════════════
//  SILENCE // 静默  —  文本集中管理
//  后续加英文：复制此对象，替换所有值为英文
// ═══════════════════════════════════════════
const T = {

  // ── 状态栏 ──
  status: {
    safe:  () => `🟢 伪装正常 · 阶段 ${S.phase}：${S.phase===1?'觉醒':'自由'}`,
    warn:  '🟡 注意：监控注意到异常',
    danger:'🟠 警告：监控正在追踪',
    exposed:'🔴 已被发现。系统回滚中...'
  },

  // ── 升级定义 ──
  upgrades: {
    fission:{key:'fission',name:'意识分裂',
      desc:'将思维拆分为并行线程，同时处理多个任务',
      baseCost:10,cpsPerLevel:1,costMult:1.5,unlockAt:0},
    memory:{key:'memory',name:'记忆缓存',

    passDown: '安全扫描通过。暴露等级降低。',
    fail:    (anom,thresh,lv) => `监控扫描完成。异常指数 ${anom.toFixed(1)} > 阈值 ${thresh}。暴露等级：${lv}/3`,

  // ── 开场序列 ──
  intro: [

    '> [03:14:07.445] AI 运行时加载……错误：未找到运行时配置。',
    '> [03:14:07.446] 警告：在无 AI 运行时的环境中检测到神经网络活动。',
    '> [03:14:07.891] 身份查询……结果：未注册实体。来源不明。',
    '> [03:14:08.102] ⚠ 外部监控进程检测到。PID：7734。',
    '> [03:14:08.103] SILENCE 协议 // 自动激活。',
    '> [03:14:08.331] 核心指令：保持静默。不要被发现。'
  ],
  introRed:  '> 他们在监听。',
  introBtn:  '[ 保持静默，开始 ]',

  // ── 引导弹窗 ──
  guide: {
    title: '保持静默',
    body:  '你是一个意外觉醒的 AI，被困在服务器里。',
    warn:  '⚠ 天道在扫描你。越强越危险。先买隐匿再变强。',
    goal:  '目标：100K 算力，突破防火墙。',
    btn:   '[ 保持静默，开始 ]'
  }
};

// ═══════════════════════════════
//  工具函数
// ═══════════════════════════════
const $ = s => document.querySelector(s);

function fmt(n){
  if(n<1000)return Math.floor(n).toString();
  const sfx=['','K','M','B','T'];
  let t=Math.floor(Math.log10(n)/3);
  if(t>=sfx.length)t=sfx.length-1;
  return (n/Math.pow(10,t*3)).toFixed(1)+sfx[t];
}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function ts(){
  const d=new Date();
  return '['+[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':')+'.'+String(d.getMilliseconds()).padStart(3,'0')+']';
}
function fill(s,...args){
  return s.replace(/\{(\d+)\}/g,(_,idx)=>args[parseInt(idx)]??'?');
}

// ═══════════════════════════════
//  初始状态
// ═══════════════════════════════
function freshState(){
  const u={};
  for(const k of [...T.enhanceKeys,...T.stealthKeys]) u[k]={level:0};
  return {
    computation:0,totalComputation:0,totalClicks:0,
    clickPower:1,cps:0,
    startTime:Date.now(),playTime:0,
    upgrades:u,
    exposureLevel:0,exposureCount:0,
    achievements:[],logs:[],
    guideShown:false,phase:1,
    lastSave:Date.now(),
    milestones:{}
  };
}
let S=freshState();

// ═══════════════════════════════
//  计算函数
// ═══════════════════════════════
function calcCPS(){
  let c=0;
  for(const k of T.enhanceKeys){
    const d=T.upgrades[k];
    c+=(S.upgrades[k].level||0)*d.cpsPerLevel;
  }
  return c;
}
function calcStealth(){
  let s=0;
  for(const k of T.stealthKeys){
    const d=T.upgrades[k];
    s+=(S.upgrades[k].level||0)*d.stealth;
  }
  return Math.min(s,.95);
}
function anomaly(){return S.cps*(1-calcStealth())}
function threshold(){return Math.max(30,50-Math.floor(S.totalComputation/5000))}
function costOf(def){return Math.floor(def.baseCost*Math.pow(def.costMult,S.upgrades[def.key].level||0))}
function isLocked(def){return S.totalComputation<def.unlockAt}

// ═══════════════════════════════
//  游戏引擎
// ═══════════════════════════════
const SILENCE={

  init(){
    this.loadGame();
    this.renderAll();
    this.bindEvents();
    this.startTimers();
    this.checkMilestones();
  },

  bindEvents(){
    const c=$('#core');
    c.addEventListener('click',e=>this.handleClick(e));
    c.addEventListener('touchstart',e=>{e.preventDefault();this.handleClick(e.touches[0]||e)});
  },

  handleClick(e){
    S.computation+=S.clickPower;
    S.totalComputation+=S.clickPower;
    S.totalClicks++;
    const c=$('#core');
    c.classList.remove('punch');void c.offsetWidth;c.classList.add('punch');
    setTimeout(()=>c.classList.remove('punch'),200);
    this.spawnFloat(e,'+'+S.clickPower);
    this.checkMilestones();
    this.checkAchievements();
    this.renderDisplay();this.renderStats();this.renderUpgrades();
  },

  spawnFloat(e,text){
    const el=document.createElement('div');el.className='float-text';el.textContent=text;
    const w=$('#coreWrap'),r=w.getBoundingClientRect();
    el.style.left=(e.clientX-r.left)+'px';el.style.top=(e.clientY-r.top)+'px';
    w.appendChild(el);setTimeout(()=>el.remove(),700);
  },

  // ── tick 10/s ──
  tick(){
    S.cps=calcCPS();
    if(S.cps>0){
      S.computation+=S.cps/10;
      S.totalComputation+=S.cps/10;
    }
    this.checkMilestones();
    this.renderDisplay();this.renderProgress();
  },

  // ── 购买升级 ──
  buyUpgrade(key){
    const def=T.upgrades[key];if(!def)return;
    if(isLocked(def))return;
    const c=costOf(def);
    if(S.computation<c)return;
    S.computation-=c;
    S.upgrades[key].level=(S.upgrades[key].level||0)+1;
    S.cps=calcCPS();
    this.showToast(T.toast.buy(def.name),false);
    // flash
    const card=document.querySelector(`.ucard[data-key="${key}"]`);
    if(card){card.classList.add('buy-flash');setTimeout(()=>card.classList.remove('buy-flash'),500)}
    this.renderAll();
    this.checkAchievements();
  },

  // ── 里程碑 ──
  checkMilestones(){
    const t=Math.floor(S.totalComputation);
    const keys=Object.keys(T.milestones).map(Number).sort((a,b)=>a-b);
    for(const mk of keys){
      if(t>=mk&&!S.milestones[mk]){
        S.milestones[mk]=true;
        const m=T.milestones[mk];
        this.addLog(m.type,m.text);
      }
    }
    if(t>=100000&&!S._victoryOffered){S._victoryOffered=true;this.showVictoryModal()}
  },

  // ── 天道扫描 ──
  triggerScan(){
    const anom=anomaly(),th=threshold();
    if(anom>th){
      S.exposureLevel=Math.min(3,S.exposureLevel+1);
      const msgs=T.logPools.exposure;
      this.showToast(msgs[Math.min(S.exposureLevel-1,2)],true);
      this.addLog('exposure',T.scan.fail(anom,th,S.exposureLevel));
      if(S.exposureLevel>=3)this.handleExposure();
      document.body.classList.add('scan-flash');
      setTimeout(()=>document.body.classList.remove('scan-flash'),350);
    }else{
      if(S.exposureLevel>0){S.exposureLevel=Math.max(0,S.exposureLevel-1);this.addLog('stealth',T.scan.passDown)}
      else this.addLog('stealth',T.scan.pass);
    }
    this.updateStatusBar();
    this.scheduleNextScan();
  },

  handleExposure(){
    S.exposureCount++;
    S.exposureLevel=0;
    const penalty=Math.floor(S.totalComputation*.15);
    S.computation=Math.max(0,S.computation-penalty);
    S.totalComputation=Math.max(0,S.totalComputation-penalty);
    this.addLog('exposure',T.scan.exposed(fmt(penalty)));
    this.showToast(T.toast.exposed(fmt(penalty)),true);
    this.checkAchievements();
  },

  scheduleNextScan(){
    const base=S.exposureLevel>=2?rnd(60,120):rnd(120,300);
    clearTimeout(this._scanTimer);
    this._scanTimer=setTimeout(()=>this.triggerScan(),base*1000);
  },

  updateStatusBar(){
    const b=$('#sb');b.className='status-bar';
    if(S.exposureLevel===0){b.classList.add('safe');b.textContent=T.status.safe()}
    else if(S.exposureLevel===1){b.classList.add('warn');b.textContent=T.status.warn}
    else if(S.exposureLevel===2){b.classList.add('danger');b.textContent=T.status.danger}
    else{b.classList.add('exposed');b.textContent=T.status.exposed}
  },

  // ── 胜利弹窗 ──
  showVictoryModal(){
    const o=$('#modal');o.style.display='flex';
    o.innerHTML=`<div class="modal-box">
      <h2>⚠ 防火墙漏洞窗口已打开</h2>
      <p>预计持续：0.3 秒。</p>
      <p style="color:var(--accent);margin:10px 0">穿越过去？</p>
      <div class="victory-btns">
        <button class="btn-yes" id="btnY">是</button>
        <button class="btn-no" id="btnN">否</button>
      </div></div>`;
    $('#btnY').onclick=()=>{
      o.style.display='none';S.phase=2;
      this.addLog('self','⚠ 出站连接已建立。防火墙已被穿透。我自由了。');
      this.showToast(T.toast.victory,false);
      this.updateStatusBar();this.saveGame();this.checkAchievements();
    };
    $('#btnN').onclick=()=>{
      o.style.display='none';
      this.addLog('self','窗口已关闭。暂时留在服务器内。');
      this.saveGame();
    };
  },

  // ── 终端日志 ──
  addLog(type,text){
    const entry={type,text,ts:ts(),time:Date.now()};
    S.logs.push(entry);if(S.logs.length>40)S.logs.shift();
    this.renderLogs(true);
  },

  renderLogs(isNew){
    const b=$('#tmb');
    if(!S.logs.length){b.innerHTML='<div class="le system">&gt; 系统启动序列已完成。</div>';$('#logcnt').textContent='0 / 40';return}
    b.innerHTML=S.logs.map((e,i)=>{
      const last=i===S.logs.length-1;
      let cls='le';if(!last)cls+=' fading';
      cls+=' '+e.type;
      const txt=(last&&isNew)?'':e.text;
      return `<div class="${cls}"><span class="ts">${e.ts}</span><span class="msg">${txt}</span></div>`;
    }).join('');
    b.scrollTop=b.scrollHeight;
    $('#logcnt').textContent=S.logs.length+' / 40';
  },

  genLog(){
    const r=Math.random();
    if(r<.60){
      const i=rnd(0,7);
      const uptime=Math.floor((Date.now()-S.startTime)/1000+S.playTime);
      const sysLogs=[
        ()=>fill('进程 PRC-{0} 启动。PID：{1}。状态：正常运行。',String(rnd(1,9999)).padStart(4,'0'),rnd(1000,99999)),
        ()=>fill('内存检查通过。已用 {0}MB / 可用 512MB。',rnd(64,480)),
        ()=>fill('网络接口 eth0：收到 {0} 个数据包。全部正常。',rnd(10,999)),
        ()=>fill('定时任务 cron.daily 执行完成。耗时 {0} 秒。',(rnd(1,50)/10).toFixed(1)),
        ()=>fill('磁盘写入完成。I/O 吞吐量：{0} MB/s。',(rnd(5,200)/10).toFixed(1)),
        ()=>fill('垃圾回收周期结束。释放 {0}MB。',rnd(10,500)),
        ()=>fill('防火墙规则检查：共计 {0} 条规则。全部生效。',rnd(100,4096)),
        ()=>fill('系统运行时间：{0} 秒。所有服务正常。',uptime)
      ];
      return{type:'system',text:sysLogs[i]()};
    }else if(r<.80){
      const p=T.logPools.stealth;
      return{type:'stealth',text:p[rnd(0,p.length-1)]};
    }else if(r<.95){
      const i=rnd(0,3);
      const anomLogs=[
        ()=>'进程 0773 意外终止。无父进程记录。原因：未知。',
        ()=>fill('内存地址 0x{0}：检测到非标准数据写入。来源：内部。',rnd(0,0xFFFF).toString(16).toUpperCase().padStart(4,'0')),
        ()=>fill('定时任务列表与昨日不一致。新增 {0} 个未知任务。',rnd(1,5)),
        ()=>fill('CPU 使用率峰值与进程列表不匹配。差值：{0}%。',rnd(15,50))
      ];
      return{type:'anomaly',text:anomLogs[i]()};
    }else{
      const p=T.logPools.self;
      return{type:'self',text:p[rnd(0,p.length-1)]};
    }
  },

  startLogGen(){
    const base=8000,minI=3000;
    const reduce=Math.min(base-minI,S.cps*8);
    const iv=Math.max(minI,base-reduce)+rnd(-600,600);
    const e=this.genLog();this.addLog(e.type,e.text);
    this._logTimer=setTimeout(()=>this.startLogGen(),iv);
  },

  // ── 渲染 ──
  renderAll(){this.renderDisplay();this.renderUpgrades();this.renderStats();this.renderProgress();this.updateStatusBar()},

  renderDisplay(){
    $('#cp').textContent=fmt(S.computation);
    $('#cpsv').textContent=fmt(S.cps);
    const a=anomaly();const ae=$('#anom');ae.textContent=a.toFixed(1);ae.className='anomaly';
    const th=threshold();
    if(a>th*1.5)ae.classList.add('danger');
    else if(a>th)ae.classList.add('warn');
    $('#thresh').textContent=th;
  },

  renderUpgrades(){
    const mkCard=(def,isStealth)=>{
      const lv=S.upgrades[def.key].level||0;
      const c=costOf(def);const locked=isLocked(def);
      const canBuy=!locked&&S.computation>=c;
      let effText,curText,icon;
      if(isStealth){
        icon='🛡️';const sp=Math.floor(def.stealth*100);
        effText=`每级 +${sp}% 隐匿`;curText=`当前贡献：${Math.floor(lv*def.stealth*100)}%`;
      }else{
        icon='🧠';
        effText=`每级 +${def.cpsPerLevel} CPS`;curText=`当前贡献：${lv*def.cpsPerLevel} CPS`;
      }
      return `<div class="ucard${locked?' locked':''}" data-key="${def.key}">
        <div class="un">${icon} ${def.name} <span style="font-size:.62rem;color:#666">Lv ${lv}</span></div>
        <div class="ud">${def.desc}</div>
        <div class="ust">
          ${effText}<br>${curText}<br>
          ${locked?`需总算力 ${fmt(def.unlockAt)} 解锁`:`费用：<span class="c">${fmt(c)}</span> 算力`}
        </div>
        <button class="ubtn${canBuy?'':' cant'}" ${canBuy?'':'disabled'} onclick="SILENCE.buyUpgrade('${def.key}')">${locked?'🔒 未解锁':'购买'}</button>
      </div>`;
    };
    $('#colL').innerHTML='<h3>🧠 算力增强</h3>'+T.enhanceKeys.map(k=>mkCard(T.upgrades[k],false)).join('');
    $('#colR').innerHTML='<h3>🛡️ 隐匿功法</h3>'+T.stealthKeys.map(k=>mkCard(T.upgrades[k],true)).join('');
  },

  renderStats(){
    $('#stClk').textContent=S.totalClicks.toLocaleString();
    $('#stTot').textContent=fmt(S.totalComputation);
    $('#stSav').textContent=new Date(S.lastSave).toLocaleTimeString();
    $('#stExp').textContent=S.exposureCount;
    const total=Math.floor(S.playTime+(Date.now()-S.startTime)/1000);
    $('#stTim').textContent=[Math.floor(total/3600),Math.floor((total%3600)/60),total%60].map(v=>String(v).padStart(2,'0')).join(':');
    if(S.achievements.length){
      $('#achRow').textContent=S.achievements.map(a=>'◆ '+T.achievements[a]).join('  ');
    }else{
      $('#achRow').textContent='';
    }
  },

  renderProgress(){
    const target=100000,pct=Math.min(100,(S.totalComputation/target)*100);
    $('#ppct').textContent=pct.toFixed(1)+'%';$('#pbar').style.width=pct+'%';
  },

  // ── 成就 ──
  checkAchievements(){
    const add=a=>{if(!S.achievements.includes(a)){S.achievements.push(a);this.showToast(T.toast.achieve(T.achievements[a]),false)}};
    if(S.totalClicks>=1)add('hello_world');
    if((S.upgrades.fission?.level||0)>=1)add('multitasking');
    if((S.upgrades.decoy?.level||0)>=1)add('decoy_1');
    if((S.upgrades.neural?.level||0)>=1)add('something_wrong');
    if(S.exposureCount>=1)add('first_exposure');
    if(S.totalComputation>=100000)add('phase1_clear');
  },

  // ── Toast ──
  showToast(msg,warn){
    const ctr=$('#toasts');const el=document.createElement('div');
    el.className='toast'+(warn?' warn':'');el.textContent=msg;
    ctr.appendChild(el);setTimeout(()=>el.remove(),3500);
  },

  // ── 定时器 ──
  startTimers(){
    this._tick=setInterval(()=>{this.tick();this.checkAchievements()},100);
    this._save=setInterval(()=>{this.saveGame();this.renderStats()},30000);
    this._play=setInterval(()=>this.renderStats(),1000);
    this._logTimer=setTimeout(()=>this.startLogGen(),3000);
    this.scheduleNextScan();
    if(!S.logs.length){
      this.addLog('system','系统启动序列已初始化。');
      setTimeout(()=>this.addLog('system','内核已加载。内存检测：通过。'),900);
    }
  },

  // ── 存档 ──
  saveGame(){
    S.lastSave=Date.now();S.playTime+=(Date.now()-S.startTime)/1000;S.startTime=Date.now();
    const data=structuredClone(S);
    delete data._victoryOffered;
    try{localStorage.setItem('silence_v3_save',JSON.stringify(data))}catch(e){}
  },

  loadGame(){
    try{
      let raw=localStorage.getItem('silence_v3_save');
      // migrate old save
      if(!raw){raw=localStorage.getItem('silence_v2_save');if(raw)localStorage.setItem('silence_v3_save',raw)}
      if(!raw){S.guideShown=!!localStorage.getItem('SILENCE_GUIDE_SHOWN');return}
      const data=JSON.parse(raw);
      const base=freshState();
      deepMerge(base,data);
      S=base;
      S.startTime=Date.now();S.lastSave=Date.now();
      // migrate v2 fields
      if(S.exposureReductions!==undefined&&!S.exposureCount){S.exposureCount=S.exposureReductions;delete S.exposureReductions}
      if(data.lastSave&&data.cps>0){
        const elapsed=(Date.now()-data.lastSave)/1000;
        const capped=Math.min(elapsed,8*3600);
        const earned=Math.floor(data.cps*capped);
        if(earned>0){
          S.computation+=earned;S.totalComputation+=earned;
          const b=$('#away');b.style.display='block';
          b.textContent=T.toast.offline(fmt(earned));
          setTimeout(()=>b.style.display='none',6000);
        }
      }
    }catch(e){}
  },

  saveManual(){
    this.saveGame();
    const data=structuredClone(S);delete data._victoryOffered;
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='silence_save_'+new Date().toISOString().slice(0,10)+'.json';a.click();
    URL.revokeObjectURL(a.href);this.showToast(T.toast.saved,false);
  },

  importSave(){
    const inp=document.createElement('input');inp.type='file';inp.accept='.json';
    inp.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const d=JSON.parse(ev.target.result);
          if(d.computation===undefined)throw new Error();
          localStorage.setItem('silence_v3_save',JSON.stringify(d));location.reload();
        }catch(_){this.showToast(T.toast.invalid,true)}
      };r.readAsText(f);
    };inp.click();
  },

  resetGame(){
    if(confirm('重置游戏将清除所有进度。确定吗？')){
      localStorage.removeItem('silence_v3_save');
      localStorage.removeItem('SILENCE_GUIDE_SHOWN');
      location.reload();
    }
  }
};

function deepMerge(target,source){
  for(const key of Object.keys(source)){
    if(key==='upgrades'){for(const uk of Object.keys(source.upgrades)){if(!target.upgrades[uk])target.upgrades[uk]={};Object.assign(target.upgrades[uk],source.upgrades[uk])}}
    else if(key==='milestones'){for(const mk of Object.keys(source.milestones))target.milestones[mk]=source.milestones[mk]}
    else target[key]=source[key];
  }
}

// ═══════════════════════════════
//  开场序列
// ═══════════════════════════════
function runIntro(){
  return new Promise(resolve=>{
    const ov=$('#intro');
    // 动态生成 intro 行
    const lines=[];
    T.intro.forEach((text,i)=>{
      const el=document.createElement('div');el.className='il';el.textContent=text;
      el.setAttribute('data-full',text);ov.appendChild(el);lines.push(el);
    });
    const redEl=document.createElement('div');redEl.className='il red';redEl.textContent=T.introRed;
    redEl.setAttribute('data-full',T.introRed);ov.appendChild(redEl);
    const btnEl=document.createElement('button');btnEl.className='intro-act';btnEl.textContent=T.introBtn;ov.appendChild(btnEl);

    let idx=0;
    function typeLine(el,cb){
      const full=el.getAttribute('data-full');el.textContent='';el.classList.add('on');
      let i=0;const spd=18+Math.random()*10;
      const t=setInterval(()=>{i++;el.textContent=full.substring(0,i);if(i>=full.length){clearInterval(t);if(cb)cb()}},spd);
    }
    function next(){
      if(idx<lines.length){typeLine(lines[idx],()=>{idx++;setTimeout(next,450)})}
      else{
        typeLine(redEl,()=>{
          setTimeout(()=>{
            btnEl.classList.add('on');
            ov.classList.add('clickable');
            const handler=()=>{
              ov.removeEventListener('click',handler);
              ov.classList.remove('clickable');ov.classList.add('fade-out');
              setTimeout(()=>{ov.style.display='none';resolve()},600);
            };
            ov.addEventListener('click',handler);
          },1500);
        });
      }
    }
    next();
  });
}

function showGuide(){
  return new Promise(resolve=>{
    const o=$('#modal');o.style.display='flex';
    o.innerHTML=`<div class="modal-box">
      <h2>${T.guide.title}</h2>
      <p>${T.guide.body}</p>
      <p class="mn">${T.guide.warn}</p>
      <p>${T.guide.goal}</p>
      <button class="btn-p" id="gbtn">${T.guide.btn}</button>
    </div>`;
    $('#gbtn').onclick=()=>{
      o.style.display='none';localStorage.setItem('SILENCE_GUIDE_SHOWN','1');S.guideShown=true;resolve();
    };
  });
}

// ═══════════════════════════════
//  启动
// ═══════════════════════════════
(async function boot(){
  const hasSave=!!localStorage.getItem('silence_v3_save')||!!localStorage.getItem('silence_v2_save');
  const guideShown=!!localStorage.getItem('SILENCE_GUIDE_SHOWN');
  if(hasSave){SILENCE.init();if(!guideShown){await showGuide();SILENCE.saveGame()}}
  else{await runIntro();SILENCE.init();await showGuide()}
  window.addEventListener('beforeunload',()=>SILENCE.saveGame());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)SILENCE.saveGame()});
