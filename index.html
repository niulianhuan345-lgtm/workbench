<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总控台</title>
<style>
:root{--bg:#f7f8f8;--card:#fff;--side:#f3f4f5;--accent:#5e6ad2;--abg:#eef0fb;
  --tx:#1a1a2e;--tx2:#6b7280;--tx3:#9ca3af;--bd:#e5e7eb;--bdl:#f0f1f3;
  --am:#f59e0b;--gn:#22c55e;--rd:#ef4444;--r:6px;--rl:12px;--s:8px;
  --sh:1px 0 0 0 rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  --wt:#fff;--tg-done-bg:#dcfce7;--tg-done-tx:#166534;--tg-prog-bg:#dbeafe;--tg-prog-tx:#1e40af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC',sans-serif;font-size:14px;font-weight:400;color:var(--tx);background:var(--bg);display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.side{width:200px;min-width:200px;background:var(--side);border-right:1px solid var(--bdl);display:flex;flex-direction:column;padding:24px 0;z-index:10}
.side-h{padding:0 20px;margin-bottom:32px;font-size:18px;font-weight:590}
.side-h span{color:var(--accent)}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);font-size:14px;color:var(--tx2);cursor:pointer;border:none;background:none;text-align:left;width:100%}
.nav-i:hover{background:var(--card);color:var(--tx)}
.nav-i.on{background:var(--card);color:var(--accent);font-weight:510;box-shadow:var(--sh)}
.nav-i .b{font-size:11px;background:var(--abg);color:var(--accent);padding:1px 7px;border-radius:10px;margin-left:auto}
/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.top h2{font-size:17px;font-weight:590}
.top-r{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--tx3)}
.top-r .rf{font-size:12px;cursor:pointer;padding:4px 10px;border-radius:var(--r);border:1px solid var(--bd);background:var(--card);color:var(--tx2)}
.top-r .rf:hover{background:var(--abg);color:var(--accent)}
.ct{padding:20px 28px 40px}
.panel{display:none}.panel.on{display:block}
/* LOADING SKELETON */
.skel{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.skel-row{height:14px;background:var(--bdl);border-radius:4px;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
/* OVERVIEW v2 */
.sum-line{font-size:13px;color:var(--tx2);margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap}
.sum-line span{white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.mcard{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh);padding:18px 20px;cursor:pointer;transition:box-shadow .15s}
.mcard:hover{box-shadow:1px 0 0 0 rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.08),0 4px 24px rgba(0,0,0,.04)}
.mv{font-size:32px;font-weight:590;color:var(--tx)}.mv.rd{color:var(--rd)}.mv.am{color:var(--am)}.mv.gn{color:var(--gn)}
.ml{font-size:12px;color:var(--tx3);margin-top:4px}
/* PROJECT PROGRESS CARDS */
.psec{margin-bottom:20px}
.psec h4{font-size:13px;font-weight:590;margin-bottom:10px;color:var(--tx)}
.prow{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer}
.pcard:hover{box-shadow:1px 0 0 0 rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.08),0 4px 24px rgba(0,0,0,.04)}
.pcard .pi{font-size:20px;flex-shrink:0}
.pcard .pn{font-size:14px;font-weight:510;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pbar-wrap{flex:2;height:6px;background:var(--bdl);border-radius:3px;overflow:hidden;min-width:60px}
.pcard .pbar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.pcard .pstat{font-size:12px;color:var(--tx2);white-space:nowrap}
/* ATTENTION v2 */
.attn2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.attn2 h4{font-size:13px;font-weight:590;margin-bottom:10px}
.aitem{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-radius:var(--r);cursor:pointer;margin-bottom:4px;font-size:13px}
.aitem:hover{background:var(--abg)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.rd{background:var(--rd)}.dot.am{background:var(--am)}.dot.bl{background:var(--accent)}.dot.gn{background:var(--gn)}
.aib{font-size:13px;flex-shrink:0}
/* TASKS */
.tbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tbar button{padding:5px 14px;border-radius:14px;font-size:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);cursor:pointer}
.tbar button.on{background:var(--accent);color:var(--wt);border-color:var(--accent)}
/* project filters */
.pbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pbar button{padding:4px 10px;border-radius:12px;font-size:11px;border:1px solid var(--bdl);background:var(--bg);color:var(--tx2);cursor:pointer}
.pbar button.on{background:var(--abg);color:var(--accent);border-color:var(--accent)}
/* view toggle */
.vtog{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--tx2)}
.vtog span{cursor:pointer;padding:4px 10px;border-radius:var(--r)}
.vtog span.on{background:var(--abg);color:var(--accent);font-weight:510}
/* priority */
.prio{width:4px;height:28px;border-radius:2px;flex-shrink:0}
.prio.hi{background:var(--rd)}.prio.md{background:var(--am)}.prio.lo{background:var(--gn)}
.tlist{list-style:none}
.trow{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--bdl);border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.trow:hover{border-color:var(--bd)}
.trow.done .tt{text-decoration:line-through;color:var(--tx3)}
.cb{width:18px;height:18px;border:2px solid var(--bd);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.cb.chk{background:var(--gn);border-color:var(--gn);color:var(--wt)}
.tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ttag{font-size:11px;padding:2px 8px;border-radius:10px}
.ttag.done{background:var(--tg-done-bg);color:var(--tg-done-tx)}.ttag.in_progress{background:var(--tg-prog-bg);color:var(--tg-prog-tx)}.ttag.pending{background:var(--bg);color:var(--tx2)}
.tdue{font-size:11px;color:var(--tx3)}.tdue.ov{color:var(--rd)}
.taib{font-size:15px}
/* GROUPED VIEW */
.tgroup{border:1px solid var(--bdl);border-radius:var(--rl);background:var(--card);margin-bottom:10px;overflow:hidden}
.tgroup-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);cursor:pointer;user-select:none}
.tgroup-h .tgc{font-size:11px;color:var(--tx3);transition:transform .15s}
.tgroup-h .tgc.op{transform:rotate(90deg)}
.tgroup-h .tgn{font-size:14px;font-weight:590;flex:1}
.tgroup-h .tgs{font-size:11px;color:var(--tx3)}
.tgroup-b{display:none;padding:4px 8px 8px}.tgroup-b.op{display:block}
/* SLIDE */
.slide{position:fixed;top:0;right:-400px;width:380px;height:100vh;background:var(--card);box-shadow:var(--sh);z-index:100;transition:right .2s;display:flex;flex-direction:column}
.slide.open{right:0}
.slide-h{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.slide-h h3{font-size:15px;font-weight:590}
.slide-b{padding:20px;flex:1;overflow-y:auto}
.slide-b label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px;margin-top:14px}
.slide-b input,.slide-b select,.slide-b textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;font-family:inherit;outline:none}
.slide-b input:focus,.slide-b select:focus{border-color:var(--accent)}
.slide-b textarea{resize:vertical;min-height:60px}
.drow{display:flex;gap:8px}
.drow input{flex:1}
.slide-f{padding:16px 20px;border-top:1px solid var(--bd);display:flex;gap:8px}
.btn{padding:7px 18px;border:none;border-radius:var(--r);font-size:13px;font-family:inherit;cursor:pointer;font-weight:510}
.btn-p{background:var(--accent);color:var(--wt)}.btn-p:hover{opacity:.9}
.btn-g{background:transparent;color:var(--tx2);border:1px solid var(--bd)}.btn-g:hover{background:var(--bg)}
.btn-r{background:transparent;color:var(--rd)}.btn-r:hover{background:#fef2f2}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:99;display:none}.backdrop.open{display:block}
/* PROJECT */
.pc{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pc-h .pi{font-size:22px}.pc-h .pn{font-size:15px;font-weight:590;flex:1}.pc-h .pp{font-size:12px;color:var(--tx3)}
.pc-toggle{cursor:pointer;font-size:12px;color:var(--tx3);transition:transform .15s;user-select:none}.pc-toggle.col{transform:rotate(-90deg)}.pc-body.col{display:none}
/* PHASE */
.ps{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 0}
.psd{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.psd.done{background:var(--gn);color:var(--wt)}.psd.in{background:var(--accent);color:var(--wt)}.psd.pend{background:var(--bd);color:var(--tx3)}
.psl{font-size:10px;color:var(--tx2);margin:0 4px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.psl.in{color:var(--accent);font-weight:510}.psl.pend{color:var(--tx3)}
.psc{width:14px;height:2px;flex-shrink:0;border-radius:1px;margin-top:8px}
.psc.dd{background:var(--gn)}.psc.di{background:linear-gradient(90deg,var(--gn),var(--accent))}.psc.ip{background:linear-gradient(90deg,var(--accent),var(--bd))}.psc.pp{background:var(--bdl)}
/* FILES */
.ft{font-size:12px;margin-top:14px;border-top:1px solid var(--bdl);padding-top:12px}
.ff{margin:1px 0}.fft{cursor:pointer;padding:3px 6px;border-radius:4px;display:flex;align-items:center;gap:4px;color:var(--tx);font-weight:510}.fft:hover{background:var(--bg)}
.far{font-size:9px;width:12px;text-align:center;color:var(--tx3);transition:transform .15s}.far.op{transform:rotate(90deg)}
.fch{display:none;margin-left:8px;border-left:1px solid var(--bdl);padding-left:12px}.fch.op{display:block}
.fi{cursor:pointer;padding:2px 8px;border-radius:4px;display:flex;align-items:center;gap:6px;color:var(--tx2)}.fi:hover{background:var(--abg);color:var(--accent)}
.fin{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fit{font-size:9px;color:var(--tx3);background:var(--bg);padding:1px 5px;border-radius:3px;margin-left:auto}
/* SYSTEM */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.scard{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh);padding:18px 20px}
.scard h4{font-size:14px;font-weight:590;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--tx2)}
.stag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg);border-radius:10px;font-size:12px;margin:3px}
.stag .dd{width:6px;height:6px;border-radius:50%;background:var(--gn)}
.ktags{display:flex;flex-wrap:wrap;gap:4px}.kt{font-size:12px;padding:4px 10px;background:var(--abg);color:var(--accent);border-radius:12px;cursor:pointer}.kt:hover{opacity:.8}
/* TOKEN STATS */
.tok-card{margin-bottom:16px}
.tok-num{font-size:36px;font-weight:590;color:var(--tx)}
.tok-sub{font-size:12px;color:var(--tx3);margin-top:4px}
.tok-tbl{width:100%;border-collapse:collapse;margin-top:12px}
.tok-tbl th,.tok-tbl td{padding:8px 10px;text-align:left;font-size:12px;border-bottom:1px solid var(--bdl)}
.tok-tbl th{color:var(--tx2);font-weight:510}
.tok-tbl td{color:var(--tx)}
.tok-tbl tr:hover td{background:var(--bg)}
/* KNOWLEDGE ACCORDION */
.kacc{margin-bottom:12px}
.kacc-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;user-select:none;font-size:14px;font-weight:510}
.kacc-h:hover{background:var(--abg)}
.kacc-h .ka-arr{font-size:11px;color:var(--tx3);transition:transform .15s}
.kacc-h .ka-arr.op{transform:rotate(90deg)}
.kacc-b{display:none;padding:14px 16px;background:var(--card);border-radius:0 0 var(--r) var(--r);margin-top:-4px;border:1px solid var(--bdl);border-top:none}
.kacc-b.op{display:block}
.kacc-b .kl{font-size:13px;color:var(--tx2);margin-bottom:8px}
.kacc-b .kf{margin-top:8px;padding-top:8px;border-top:1px solid var(--bdl)}
.kacc-b .kfi{font-size:12px;color:var(--tx2);padding:2px 0;cursor:pointer;display:flex;align-items:center;gap:6px}
.kacc-b .kfi:hover{color:var(--accent)}
/* KNOWLEDGE TAB */
.kwrap{display:flex;gap:0;height:calc(100vh - 130px);min-height:500px}
.knav{width:280px;min-width:280px;background:var(--side);border-right:1px solid var(--bdl);overflow-y:auto;padding:8px 0}
.knav-cat{margin-bottom:2px}
.knav-cat-h{font-size:11px;font-weight:590;color:var(--tx3);padding:10px 16px 6px;letter-spacing:.3px}
.knav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--tx2);border-left:3px solid transparent;transition:all .12s;margin:0}
.knav-item:hover{background:var(--card);color:var(--tx)}
.knav-item.on{background:var(--abg);color:var(--accent);border-left-color:var(--accent);font-weight:510}
.kni-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center}
.kni-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kni-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kni-dot.active{background:var(--gn)}.kni-dot.limited{background:var(--am)}.kni-dot.stable{background:var(--tx3)}
.kdetail{flex:1;overflow-y:auto;padding:24px 32px}
.kd-card{background:var(--card);border-radius:var(--rl);box-shadow:var(--sh);padding:28px 32px;margin-bottom:20px}
.kd-h{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--bdl)}
.kd-h .kd-icon{font-size:32px;flex-shrink:0}
.kd-h .kd-info{flex:1;min-width:0}
.kd-h .kd-name{font-size:18px;font-weight:590;color:var(--tx)}
.kd-h .kd-sub{font-size:12px;color:var(--tx3);margin-top:2px}
.kd-stag{font-size:11px;padding:3px 12px;border-radius:10px;font-weight:510;flex-shrink:0}
.kd-stag.active{background:#dcfce7;color:#166534}
.kd-stag.limited{background:#fef3c7;color:#92400e}
.kd-stag.stable{background:var(--bg);color:var(--tx2)}
.kd-sec{margin-bottom:24px}
.kd-sec-h{font-size:13px;font-weight:590;color:var(--tx);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.kd-src{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);font-size:12px}
.kd-src:nth-child(even){background:var(--bg)}
.kd-src .kd-url{font-family:'SF Mono',Monaco,Menlo,monospace;font-size:11px;color:var(--tx3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.kd-src .kd-what{font-size:11px;color:var(--tx2);flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kd-src .kd-tag{font-size:10px;padding:2px 8px;border-radius:8px;flex-shrink:0;white-space:nowrap}
.kd-src .kd-tag.s-active{background:#dcfce7;color:#166534}
.kd-src .kd-tag.s-stale{background:#fef3c7;color:#92400e}
.kd-src .kd-tag.s-limited{background:#fef3c7;color:#92400e}
.kd-src .kd-tag.s-stable{background:var(--bg);color:var(--tx2)}
.kd-ks{border:1px solid var(--bdl);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.kd-ks-h{font-size:12px;font-weight:510;color:var(--tx);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.kd-verified{font-size:10px;color:var(--am);background:#fef3c7;padding:1px 6px;border-radius:6px}
.kd-ks-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.kd-ks-list li{font-size:12px;color:var(--tx2);padding:2px 0 2px 14px;position:relative}
.kd-ks-list li::before{content:'·';position:absolute;left:2px;color:var(--accent);font-weight:700}
.kd-chg-date{font-size:11px;font-weight:510;color:var(--accent);background:var(--abg);padding:3px 10px;border-radius:8px;display:inline-block;margin-bottom:6px}
.kd-chg-list{list-style:none;margin-bottom:14px}
.kd-chg-list li{font-size:12px;color:var(--tx2);padding:2px 0 2px 14px;position:relative}
.kd-chg-list li::before{content:'·';position:absolute;left:2px;color:var(--tx3)}
.kd-insight{background:#eff6ff;border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 18px;font-size:12px;color:#1e40af;line-height:1.6;margin-top:16px}
.kd-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:14px;flex-direction:column;gap:8px}
.kd-empty-icon{font-size:48px;opacity:.5}
/* Knowledge v2 article cards */
.kd-art{background:var(--card);border:1px solid var(--bdl);border-radius:var(--rl);padding:14px 16px;margin-bottom:8px}
.kd-art-h{font-size:14px;font-weight:510;margin-bottom:4px}
.kd-art-meta{margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.kd-art-foot{display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--bdl)}
.kd-tag{display:inline-block;font-size:10px;background:var(--abg);color:var(--accent);padding:1px 7px;border-radius:8px}
/* SEARCH MODAL */
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
.search-overlay.open{display:flex}
.search-box{width:500px;max-width:90vw;background:var(--card);border-radius:var(--rl);box-shadow:0 8px 30px rgba(0,0,0,.15);overflow:hidden}
.search-input{padding:16px 20px;border:none;width:100%;font-size:16px;font-family:inherit;outline:none;color:var(--tx);background:transparent}
.search-results{max-height:360px;overflow-y:auto;border-top:1px solid var(--bdl);padding:4px 0}
.search-res{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;color:var(--tx)}
.search-res:hover{background:var(--abg)}
.search-res .sr-icon{flex-shrink:0;font-size:16px}
.search-res .sr-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-res .sr-sub{font-size:11px;color:var(--tx3)}
.search-empty{padding:24px;text-align:center;color:var(--tx3);font-size:13px}
/* TOAST */
.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;background:var(--tx);color:var(--wt);border-radius:var(--r);font-size:13px;animation:in .2s ease}@keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
/* EMPTY */
.empty{padding:32px;text-align:center;color:var(--tx3);font-size:13px}
/* MISC */
@media(max-width:768px){
  .side{display:none}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .attn2{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .pcard{flex-wrap:wrap}
  .pcard .pbar-wrap{flex:1 1 100%}
  .ps{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .trow,.tgroup-h{padding:14px 12px}
  .cb{width:22px;height:22px}
  .search-box{max-width:95vw;margin:0 8px}
}
</style>
</head>
<body>

<div class="side">
  <div class="side-h">AIONE <span>总控台</span></div>
  <div class="nav" id="nav"></div>
</div>

<main class="main">
  <div class="top">
    <h2 id="ttl">🏠 概览</h2>
    <div class="top-r">
      <span id="lu">加载中...</span>
      <button class="rf" onclick="refreshData()" title="刷新数据">🔄 刷新</button>
    </div>
  </div>
  <div class="ct">
    <div class="panel on" id="tab-overview">
      <div style="font-size:13px;color:var(--tx2);margin-bottom:16px" id="summary"></div>
      <div class="mgrid" id="metrics"></div>
      <div class="psec"><h4>📁 项目进度</h4><div class="prow" id="pprog"></div></div>
      <div class="psec" id="knsnap"></div>
      <div class="attn2" id="attention"></div>
    </div>
    <div class="panel" id="tab-tasks">
      <div class="tbar" id="tfilters"></div>
      <div class="pbar" id="pfilters"></div>
      <div class="vtog"><span id="vlist" class="on" onclick="setView('list')">📋 列表</span><span id="vgroup" onclick="setView('group')">📁 按项目分组</span></div>
      <div class="tlist" id="tlist"></div>
    </div>
    <div class="panel" id="tab-projects"></div>
    <div class="panel" id="tab-system">
      <div class="tok-card" id="tokstats"></div>
      <div style="font-size:14px;font-weight:590;margin-bottom:12px">📖 学习知识</div>
      <div id="kaccs"></div>
      <div class="sgrid" id="sgrid" style="margin-top:20px"></div>
    </div>
    <div class="panel" id="tab-knowledge">
      <div class="kwrap">
        <div class="knav" id="knav"></div>
        <div class="kdetail" id="kdetail"></div>
      </div>
    </div>
  </div>
</main>

<div class="backdrop" id="bd" onclick="closeSlide()"></div>
<div class="slide" id="slide">
  <div class="slide-h"><h3>编辑任务</h3><button class="btn-g" style="padding:4px 10px;font-size:16px" onclick="closeSlide()">✕</button></div>
  <div class="slide-b">
    <label>标题</label><input id="etitle">
    <label>状态</label><select id="estatus"><option value="pending">待处理</option><option value="in_progress">进行中</option><option value="done">已完成</option></select>
    <label>负责人</label><input id="eowner">
    <label>截止日期</label><div class="drow"><input type="date" id="edate" onchange="document.getElementById('edtxt').value=''"><input id="edtxt" placeholder="或输入文本" oninput="document.getElementById('edate').value=''"></div>
    <label>AI可协助</label><select id="eai"><option value="0">否</option><option value="1">是</option></select>
    <label>备注</label><textarea id="enote"></textarea>
  </div>
  <div class="slide-f"><button class="btn-p" onclick="saveSlide()">保存</button><button class="btn-r" onclick="delSlide()">删除</button></div>
</div>

<!-- SEARCH MODAL -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input class="search-input" id="searchInput" placeholder="搜索任务或文件... (Esc 关闭)" oninput="doSearch()">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
// ── STATE ──
let tasks=[],projects=[],knowledge=[],skills=[],sys={},tokens=[];
let tab='overview',tfilt='all',pfilt='all',viewMode='list',editing=null,loading=true,kcat=null,kid=null;

// ── INIT ──
async function init(){
  loading=true;
  try{
    let [t,p,k,s,y,tk]=await Promise.all([
      fetch('data/tasks.json').then(r=>{if(!r.ok)throw new Error('tasks');return r.json()}),
      fetch('data/projects.json').then(r=>{if(!r.ok)throw new Error('projects');return r.json()}),
      fetch('data/knowledge-v2.json').then(r=>r.ok?r.json():fetch('data/knowledge.json').then(r=>r.json())),
      fetch('data/skills.json').then(r=>{if(!r.ok)throw new Error('skills');return r.json()}),
      fetch('data/system.json').then(r=>{if(!r.ok)throw new Error('system');return r.json()}),
      fetch('data/tokens.json').then(r=>r.ok?r.json():[])
    ]);
    tasks=t;projects=p;knowledge=k;skills=s;sys=y;tokens=tk;
  }catch(e){
    toast('数据加载失败，请检查服务','err');
  }
  loading=false;
  updateTime();
  renderNav();renderAll();
}
init();

// Auto-refresh check every 60s
setInterval(checkRefresh,60000);
async function checkRefresh(){
  try{
    let r=await fetch('data/system.json',{cache:'no-store'});
    if(!r.ok)return;
    let s=await r.json();
    if(s.started!==sys.started){
      sys=s;
      let [t,tk]=await Promise.all([
        fetch('data/tasks.json').then(r=>r.json()),
        fetch('data/tokens.json').then(r=>r.ok?r.json():[])
      ]);
      tasks=t;tokens=tk;
      renderNav();renderAll();
      toast('数据已自动更新');
    }
    updateTime();
  }catch(e){}
}

function updateTime(){
  let now=new Date();
  let h=String(now.getHours()).padStart(2,'0');
  let m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('lu').textContent='最后更新: '+h+':'+m;
}

function refreshData(){
  init().then(()=>toast('已刷新'));
}

// ── NAV ──
function renderNav(){
  let p=tasks.filter(t=>t.status==='pending').length;
  document.getElementById('nav').innerHTML=[
    {t:'overview',icon:'🏠',label:'概览',badge:''},
    {t:'tasks',icon:'📋',label:'任务',badge:`<span class="b">${p||0}</span>`},
    {t:'projects',icon:'📁',label:'项目',badge:''},
    {t:'knowledge',icon:'📖',label:'知识',badge:''},
    {t:'system',icon:'⚙️',label:'系统',badge:''}
  ].map(n=>`<button class="nav-i${tab===n.t?' on':''}" onclick="switchTab('${n.t}')">${n.icon} ${n.label}${n.badge}</button>`).join('');
}

function switchTab(t){
  tab=t;
  let tt={overview:'🏠 概览',tasks:'📋 任务',projects:'📁 项目',knowledge:'📖 知识',system:'⚙️ 系统'};
  document.getElementById('ttl').textContent=tt[t];
  document.querySelectorAll('.nav-i').forEach((e,i)=>{
    let tabs=['overview','tasks','projects','knowledge','system'];
    e.classList.toggle('on',tabs[i]===t);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  renderAll();
}

function renderAll(){
  if(loading){
    document.getElementById('summary').innerHTML='<div class="skel"><div class="skel-row"></div><div class="skel-row"></div></div>';
    document.getElementById('metrics').innerHTML='<div class="skel"><div class="skel-row"></div><div class="skel-row"></div></div>';
    return;
  }
  renderOverview();
  renderTasks();
  renderProjects();
  renderKnowledge();
  renderSystem();
}

// ── OVERVIEW v2 ──
function renderOverview(){
  let d=tasks.filter(t=>t.status==='done').length;
  let p=tasks.filter(t=>t.status==='pending').length;
  let ip=tasks.filter(t=>t.status==='in_progress').length;
  let ov=countOverdue();
  let ai=tasks.filter(t=>t.ai).length;
  let ap=new Set(tasks.map(t=>t.project).filter(Boolean)).size;
  let aiPct=tasks.length?Math.round(ai/tasks.length*100):0;

  // Summary line
  document.getElementById('summary').innerHTML=
    `<span>✅ 今日完成 ${d} 项</span><span>·</span><span>⚠️ 逾期 ${ov} 项</span><span>·</span><span>📁 活跃项目 ${ap} 个</span><span>·</span><span>🤖 AI 可协助 ${aiPct}%</span>`;

  // 5 stat cards
  document.getElementById('metrics').innerHTML=[
    {v:p,l:'待处理',c:'',filt:'pending'},
    {v:ip,l:'进行中',c:'',filt:'in_progress'},
    {v:d,l:'已完成',c:' gn',filt:'done'},
    {v:ov,l:'逾期',c:ov?' rd':'',filt:'overdue'},
    {v:ai,l:'AI可协助',c:'',filt:'ai'}
  ].map(m=>`<div class="mcard" onclick="switchTab('tasks');tfilt='${m.filt}';setTimeout(()=>renderTasks(),50)"><div class="mv${m.c}">${m.v}</div><div class="ml">${m.l}</div></div>`).join('');

  // Project progress cards
  let plist=[...projects].sort((a,b)=>{
    let ca=tasks.filter(t=>t.project===a.name).length;
    let cb=tasks.filter(t=>t.project===b.name).length;
    return cb-ca;
  });
  document.getElementById('pprog').innerHTML=plist.map(pj=>{
    let pt=pj.phases?parsePhases(pj.phases):[];
    let dn=pt.filter(x=>x.s==='done').length;
    let pct=pt.length?Math.round(dn/pt.length*100):0;
    let tc=tasks.filter(t=>t.project===pj.name).length;
    return `<div class="pcard" onclick="switchTab('tasks');pfilt='${h(pj.name)}';setTimeout(()=>renderTasks(),50)">
      <span class="pi">${pj.icon||'📁'}</span>
      <span class="pn">${h(pj.name)}</span>
      <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct}%"></div></div>
      <span class="pstat">${dn}/${pt.length} 阶段 · ${tc} 任务</span>
    </div>`;
  }).join('')||'<div class="empty">暂无项目</div>';

  // Knowledge snapshot
  if(knowledge&&knowledge.categories){
    let kt=knowledge.categories.reduce((s,c)=>s+c.items.length,0);
    let ksrc=0;knowledge.categories.forEach(c=>c.items.forEach(i=>{ksrc+=(i.sources||[]).length}));
    let activeCats=knowledge.categories.filter(c=>c.items.some(i=>i.status==='active')).length;
    document.getElementById('knsnap').innerHTML=`<h4>📖 知识快照</h4><div class="mgrid" style="margin-bottom:0">`+
      `<div class="mcard" onclick="switchTab('knowledge')"><div class="mv">${h(knowledge.updated||'--')}</div><div class="ml">最后更新</div></div>`+
      `<div class="mcard" onclick="switchTab('knowledge')"><div class="mv">${knowledge.categories.length}</div><div class="ml">知识分类</div></div>`+
      `<div class="mcard" onclick="switchTab('knowledge')"><div class="mv">${kt}</div><div class="ml">知识条目</div></div>`+
      `<div class="mcard" onclick="switchTab('knowledge')"><div class="mv">${ksrc}</div><div class="ml">数据来源</div></div>`+
      `<div class="mcard" onclick="switchTab('knowledge')"><div class="mv gn">${activeCats}</div><div class="ml">活跃追踪</div></div>`+
      `</div>`;
  }

  // Attention 2-col
  let ovt=tasks.filter(t=>isOverdue(t)).slice(0,5);
  let rec=[...tasks].filter(t=>t.status!=='done').sort((a,b)=>b.id.localeCompare(a.id)).slice(0,5);
  document.getElementById('attention').innerHTML=[
    {t:'🔴 逾期任务',items:ovt,dot:'rd'},
    {t:'🔵 最近更新',items:rec,dot:'bl'}
  ].map(c=>`<div><h4>${c.t}</h4>${c.items.length?c.items.map(t=>`<div class="aitem" onclick="openSlide('${t.id}')"><span class="dot ${c.dot}"></span><span>${h(t.title)}</span>${t.ai?`<span class="aib">🤖</span>`:''}${t.deadline?`<span style="font-size:10px;color:var(--tx3);margin-left:auto">${h(t.deadline)}</span>`:''}</div>`).join(''):`<div class="empty" style="padding:12px">暂无</div>`}</div>`).join('');
}

// ── TASKS ──
function getPriority(t){
  if(t.status==='done')return null;
  if(!t.deadline)return 'lo';
  if(isOverdue(t))return 'hi';
  if(isThisWeek(t.deadline))return 'md';
  return 'lo';
}
function isThisWeek(dl){
  if(!dl)return false;
  let now=new Date();now.setHours(0,0,0,0);
  let cur=now.getDay();cur=cur===0?7:cur;
  let mon=new Date(now);mon.setDate(now.getDate()-(cur-1));
  let sun=new Date(mon);sun.setDate(mon.getDate()+6);
  let parsed=parseDeadline(dl);
  return parsed?parsed>=mon&&parsed<=sun:false;
}
function parseDeadline(dl){
  let now=new Date();now.setHours(0,0,0,0);
  let m2=dl.match(/(\d+)月中旬/);
  if(m2)return new Date(now.getFullYear(),parseInt(m2[1])-1,15);
  let wd={一:1,二:2,三:3,四:4,五:5,六:6,日:0};
  let m3=dl.match(/本周([一二三四五六日])/);
  if(m3){
    let cur=now.getDay();cur=cur===0?7:cur;
    let mon=new Date(now);mon.setDate(now.getDate()-(cur-1));
    return new Date(mon);mon.setDate(mon.getDate()+wd[m3[1]]-1);
  }
  let m=dl.match(/(\d+)月(\d+)/);
  if(m)return new Date(now.getFullYear(),parseInt(m[1])-1,parseInt(m[2]));
  return null;
}

function renderTasks(){
  let flt=tasks;
  if(tfilt==='pending')flt=tasks.filter(t=>t.status==='pending');
  else if(tfilt==='in_progress')flt=tasks.filter(t=>t.status==='in_progress');
  else if(tfilt==='done')flt=tasks.filter(t=>t.status==='done');
  else if(tfilt==='overdue')flt=tasks.filter(t=>isOverdue(t));
  else if(tfilt==='ai')flt=tasks.filter(t=>t.ai);
  if(pfilt!=='all')flt=flt.filter(t=>t.project===pfilt);

  // Status filter buttons
  let cnt={all:tasks.length,pending:tasks.filter(t=>t.status==='pending').length,in_progress:tasks.filter(t=>t.status==='in_progress').length,done:tasks.filter(t=>t.status==='done').length,overdue:countOverdue(),ai:tasks.filter(t=>t.ai).length};
  document.getElementById('tfilters').innerHTML=[['all','全部'],['in_progress','进行中'],['pending','待处理'],['done','已完成'],['overdue','逾期'],['ai','🤖 AI']].map(([k,l])=>`<button class="${tfilt===k?'on':''}" onclick="tfilt='${k}';renderTasks()">${l} ${cnt[k]}</button>`).join('');

  // Project filter buttons
  let projMap={};tasks.forEach(t=>{let p=t.project||'其他';projMap[p]=(projMap[p]||0)+1});
  let pkeys=Object.keys(projMap).sort((a,b)=>projMap[b]-projMap[a]);
  document.getElementById('pfilters').innerHTML=[`<button class="${pfilt==='all'?'on':''}" onclick="pfilt='all';renderTasks()">全部项目 ${tasks.length}</button>`].concat(pkeys.map(k=>`<button class="${pfilt===k?'on':''}" onclick="pfilt='${k}';renderTasks()">${h(k)} ${projMap[k]}</button>`)).join('');

  // View toggle
  document.getElementById('vlist').classList.toggle('on',viewMode==='list');
  document.getElementById('vgroup').classList.toggle('on',viewMode==='group');

  if(viewMode==='group'){
    renderGroupedTasks(flt);
    return;
  }

  // Empty state
  if(!flt.length){
    let msgs={
      all:'✨ 太棒了，没有待处理任务！',
      pending:'🎉 暂无待处理任务',
      in_progress:'📭 没有进行中的任务',
      done:'📋 还没有已完成的任务',
      overdue:'✅ 没有逾期任务，继续保持！',
      ai:'🤖 没有 AI 可协助的任务'
    };
    if(pfilt!=='all')msgs={all:'📂 该项目暂无任务'};
    document.getElementById('tlist').innerHTML=`<div class="empty">${msgs[tfilt]||msgs.all}</div>`;
    return;
  }

  document.getElementById('tlist').innerHTML=flt.map(t=>{
    let ov=isOverdue(t);
    let pri=getPriority(t);
    return`<div class="trow${t.status==='done'?' done':''}" onclick="openSlide('${t.id}')">
      ${pri?`<div class="prio ${pri}"></div>`:''}
      <div class="cb${t.status==='done'?' chk':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${t.status==='done'?'✓':''}</div>
      <span class="tt">${h(t.title)}</span>
      <div class="tmeta">
        <span class="ttag ${t.status}">${({done:'已完成',in_progress:'进行中',pending:'待处理'})[t.status]}</span>
        ${t.deadline?`<span class="tdue${ov?' ov':''}">${h(t.deadline)}</span>`:''}
        ${t.ai?`<span class="taib">🤖</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderGroupedTasks(flt){
  let groups={};
  flt.forEach(t=>{let p=t.project||'其他';if(!groups[p])groups[p]=[];groups[p].push(t)});
  let gkeys=Object.keys(groups).sort();

  if(!gkeys.length){
    document.getElementById('tlist').innerHTML='<div class="empty">📂 暂无任务</div>';
    return;
  }

  document.getElementById('tlist').innerHTML=gkeys.map(k=>{
    let gt=groups[k];
    let dn=gt.filter(t=>t.status==='done').length;
    return`<div class="tgroup">
      <div class="tgroup-h" onclick="togGroup(this)">
        <span class="tgc">▶</span>
        <span class="tgn">📁 ${h(k)}</span>
        <span class="tgs">${dn}/${gt.length} 完成</span>
      </div>
      <div class="tgroup-b">${gt.map(t=>{
        let ov=isOverdue(t);
        let pri=getPriority(t);
        return`<div class="trow${t.status==='done'?' done':''}" onclick="openSlide('${t.id}')">
          ${pri?`<div class="prio ${pri}"></div>`:''}
          <div class="cb${t.status==='done'?' chk':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${t.status==='done'?'✓':''}</div>
          <span class="tt">${h(t.title)}</span>
          <div class="tmeta">
            <span class="ttag ${t.status}">${({done:'已完成',in_progress:'进行中',pending:'待处理'})[t.status]}</span>
            ${t.deadline?`<span class="tdue${ov?' ov':''}">${h(t.deadline)}</span>`:''}
            ${t.ai?`<span class="taib">🤖</span>`:''}
          </div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}

function setView(m){viewMode=m;renderTasks();}
function togGroup(el){
  let a=el.querySelector('.tgc'),b=el.querySelector('.tgroup-b')||el.nextElementSibling;
  a.classList.toggle('op');b.classList.toggle('op');
}

// ── SLIDE PANEL ──
function openSlide(id){
  editing=tasks.find(t=>t.id===id);if(!editing)return;
  document.getElementById('etitle').value=editing.title;
  document.getElementById('estatus').value=editing.status;
  document.getElementById('eowner').value=editing.owner||'';
  document.getElementById('edate').value='';
  document.getElementById('edtxt').value=editing.deadline||'';
  document.getElementById('eai').value=editing.ai?'1':'0';
  document.getElementById('enote').value=editing.note||'';
  document.getElementById('slide').classList.add('open');
  document.getElementById('bd').classList.add('open');
}
function closeSlide(){document.getElementById('slide').classList.remove('open');document.getElementById('bd').classList.remove('open');editing=null}
async function saveSlide(){
  if(!editing)return;
  editing.title=document.getElementById('etitle').value;
  editing.status=document.getElementById('estatus').value;
  editing.owner=document.getElementById('eowner').value;
  editing.deadline=document.getElementById('edtxt').value||document.getElementById('edate').value;
  editing.ai=document.getElementById('eai').value==='1';
  editing.note=document.getElementById('enote').value;
  closeSlide();renderAll();await saveTasks();
}
async function delSlide(){
  if(!editing||!confirm('删除「'+editing.title+'」？'))return;
  tasks=tasks.filter(t=>t.id!==editing.id);
  closeSlide();renderAll();await saveTasks();
}
async function toggleTask(id){
  let t=tasks.find(t=>t.id===id);if(!t)return;
  t.status=t.status==='done'?'pending':'done';
  renderAll();await saveTasks();
}
async function saveTasks(){
  try{await fetch('/api/tasks/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(tasks)});toast('已保存')}catch(e){/*Pages mode*/}
}

// ── PROJECTS ──
function renderProjects(){
  let pg=document.getElementById('tab-projects');
  pg.innerHTML=projects.map(p=>{
    let pt=p.phases?parsePhases(p.phases):[];
    let dn=pt.filter(x=>x.s==='done').length;
    let pct=pt.length?Math.round(dn/pt.length*100):0;
    let ft=renderFileTree(p.files||[]);
    return '<div class="pc" id="pc-'+p.id+'">'+
      '<div class="pc-h"><span class="pi">'+(p.icon||'📁')+'</span><span class="pn">'+h(p.name)+'</span><span class="pp">'+dn+'/'+pt.length+' · '+pct+'%</span><span class="pc-toggle" onclick="event.stopPropagation();toggleProject(\''+p.id+'\')">▾</span></div>'+
      '<div class="pc-body">'+
        (pt.length?'<div class="ps">'+pt.map((ph,i)=>{let prev=i>0?pt[i-1].s:null;let conn='';if(i>0){if(prev==='done'&&ph.s==='done')conn='dd';else if(prev==='done'&&ph.s==='in_progress')conn='di';else if(prev==='in_progress'&&ph.s==='pending')conn='ip';else if(prev==='pending'&&ph.s==='pending')conn='pp';}
        return(conn?'<div class="psc '+conn+'"></div>':'')+'<div class="psd '+(ph.s==='done'?'done':ph.s==='in_progress'?'in':'pend')+'">'+(ph.s==='done'?'✓':ph.s==='in_progress'?'↻':'○')+'</div><span class="psl '+(ph.s==='done'?'':ph.s==='in_progress'?'in':'pend')+'">'+h(ph.n)+'</span>';}).join('')+'</div>':'')+
        (ft?'<div class="ft"><div style="font-size:12px;color:var(--tx3);margin-bottom:8px">📂 文件列表</div>'+ft+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleProject(id){
  var b=document.querySelector('#pc-'+id+' .pc-body');
  var t=document.querySelector('#pc-'+id+' .pc-toggle');
  if(b)b.classList.toggle('col');
  if(t)t.classList.toggle('col');
}
function parsePhases(str){
  return str.split(' → ').map(s=>{let i=s.lastIndexOf(':');return {n:(i>-1?s.substring(0,i):s).trim(),s:i>-1?s.substring(i+1).trim():'pending'}});
}

// ── FILE TREE ──
function renderFileTree(nodes,d=0){
  if(!nodes||!nodes.length)return'';
  return nodes.map(n=>{
    if(n.type==='folder')return`<div class="ff"><div class="fft" style="padding-left:${d*14}px" onclick="tog(this)"><span class="far">▶</span>📁 ${h(n.name)}</div><div class="fch">${renderFileTree(n.children,d+1)}</div></div>`;
    let icon=n.type==='md'?'📝':n.type==='html'?'🌐':n.type==='pdf'?'📄':'📎';
    return`<div class="fi" style="padding-left:${d*14+14}px" onclick="${n.path?`window.open('/'+encodeURI('${n.path}'),'_blank')`:`toast('预览开发中')`}"><span>${icon}</span><span class="fin">${h(n.name)}</span><span class="fit">${n.type||'file'}</span></div>`;
  }).join('');
}
function tog(el){let a=el.querySelector('.far'),c=el.nextElementSibling;a.classList.toggle('op');c.classList.toggle('op');}

// ── KNOWLEDGE ──
function kcatById(id){return knowledge.categories.find(c=>c.id===id)}
function kitemById(catId,itemId){let cat=kcatById(catId);return cat?cat.items.find(i=>i.id===itemId):null}

function renderKnowledge(){
  if(!knowledge)return;
  if(!knowledge.categories&&!knowledge.platforms)return;
  if(knowledge.platforms){
    if(!kcat){kcat='p';kid=knowledge.platforms[0].id;}
  }else{
    if(!kcat||!kcatById(kcat)){
      kcat=knowledge.categories[0].id;
      kid=knowledge.categories[0].items[0].id;
    }
  }
  renderKnowledgeNav();
  renderKnowledgeDetail();
}

function renderKnowledgeNav(){
  let h='';
  // v2 format
  if(knowledge.platforms){
    h+=`<div class="knav-cat"><div class="knav-cat-h">🌐 平台情报</div>`;
    knowledge.platforms.forEach(p=>{
      let n=(p.articles||[]).length;
      h+=`<div class="knav-item${kcat==='p'&&kid===p.id?' on':''}" onclick="kcat='p';kid='${p.id}';renderKnowledgeDetail()">
        <span class="kni-icon">${p.icon||'📄'}</span>
        <span class="kni-name">${h(p.name)}</span>
        ${n>0?`<span class="b">${n}</span>`:''}
      </div>`;
    });
    h+='</div>';

    if(knowledge.internal){
      h+=`<div class="knav-cat"><div class="knav-cat-h">🏠 内部知识</div>`;
      knowledge.internal.forEach(item=>{
        h+=`<div class="knav-item${kcat==='i'&&kid===item.id?' on':''}" onclick="kcat='i';kid='${item.id}';renderKnowledgeDetail()">
          <span class="kni-icon">${item.icon||'📄'}</span>
          <span class="kni-name">${h(item.name)}</span>
        </div>`;
      });
      h+='</div>';
    }
    document.getElementById('knav').innerHTML=h;
    // 默认选中第一个平台
    if(!kcat&&knowledge.platforms.length){kcat='p';kid=knowledge.platforms[0].id;renderKnowledgeDetail();}
    return;
  }
  // v1 fallback
  knowledge.categories.forEach(cat=>{
    h+=`<div class="knav-cat"><div class="knav-cat-h">${h(cat.name)}</div>`;
    cat.items.forEach(item=>{
      let on=kcat===cat.id&&kid===item.id;
      let st=item.status||'stable';
      let dotCls=st==='active'?'active':st==='limited'?'limited':'stable';
      h+=`<div class="knav-item${on?' on':''}" onclick="kcat='${cat.id}';kid='${item.id}';renderKnowledgeDetail()">
        <span class="kni-icon">${item.icon||'📄'}</span>
        <span class="kni-name">${h(item.name)}</span>
        <span class="kni-dot ${dotCls}"></span>
      </div>`;
    });
    h+='</div>';
  });
  document.getElementById('knav').innerHTML=h;
}

function renderKnowledgeDetail(){
  // v2 format
  if(knowledge.platforms){
    let item=null;
    if(kcat==='p') item=knowledge.platforms.find(p=>p.id===kid);
    else if(kcat==='i') item=knowledge.internal.find(i=>i.id===kid);
    
    if(!item){
      document.getElementById('kdetail').innerHTML=`<div class="kd-empty"><div class="kd-empty-icon">📖</div>请从左侧选择知识条目</div>`;
      return;
    }
    
    let summary=item.knowledge_summary;
    let articles=item.articles||[];
    let daily=item.daily_log||[];
    let stats=item.stats||{};
    let total=stats.total_courses||0;
    let have=stats.articles_with_body||0;
    let pct=total>0?Math.round(have/total*100):0;
    
    let h='';
    // 头部
    h+=`<div class="kd-card">
      <div class="kd-h">
        <div class="kd-icon">${item.icon||'📄'}</div>
        <div class="kd-info">
          <div class="kd-name">${h(item.name)}</div>
          <div style="font-size:12px;color:var(--tx3)">${h(item.source_label||'')} · ${h(item.method||'')}</div>
        </div>
      </div>`;
    
    // 进度条
    if(total>0){
      h+=`<div class="kd-sec"><div class="kd-sec-h">📊 学习进度</div>
        <div style="margin:8px 0;background:var(--bdl);border-radius:4px;height:6px">
          <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:4px"></div>
        </div>
        <div style="font-size:12px;color:var(--tx3)">${have}/${total} 篇</div></div>`;
    }
    
    // 文章列表
    if(articles.length>0){
      h+=`<div class="kd-sec"><div class="kd-sec-h">📖 已学文章 (${articles.length})</div>`;
      articles.forEach(a=>{
        h+=`<div class="kd-art">
          <div class="kd-art-h"><span>${a.type||'📝'}</span> ${h(a.title)}</div>
          <div class="kd-art-meta">
            ${(a.tags||[]).map(t=>`<span class="kd-tag">${h(t)}</span>`).join(' ')}
            ${a.lecturer?`<span style="color:var(--tx3);font-size:11px">👤 ${h(a.lecturer)}</span>`:''}
          </div>
          <div class="kd-art-foot">
            <a href="${a.source_url||'#'}" target="_blank" style="color:var(--accent);text-decoration:none;font-size:12px">🔗 查看原文</a>
            <span style="font-size:11px;color:var(--tx3)">${a.learned_at||''}</span>
          </div>
        </div>`;
      });
      h+='</div>';
    }
    
    // 知识总结（无文章时显示）
    if(summary && articles.length===0){
      h+=`<div class="kd-sec"><div class="kd-sec-h">📚 ${h(summary.title)}</div>`;
      (summary.sections||[]).forEach(s=>{
        h+=`<div class="kd-ks"><div class="kd-ks-h">${h(s.heading)}</div>
          <ul class="kd-ks-list">${(s.items||[]).map(i=>`<li>${h(i)}</li>`).join('')}</ul></div>`;
      });
      h+='</div>';
    }
    
    // 变更日志
    if(daily.length>0){
      h+=`<div class="kd-sec"><div class="kd-sec-h">📋 变更日志</div>`;
      daily.slice(0,10).forEach(d=>{
        h+=`<div class="kd-chg-date">${h(d.date)}</div>
          <div style="font-size:13px;color:var(--tx2);padding:0 0 8px 12px">${h(d.action)}: ${h(d.note||'')}${d.new>0?` (+${d.new})`:''}</div>`;
      });
      h+='</div>';
    }
    
    h+='</div>';
    document.getElementById('kdetail').innerHTML=h;
    return;
  }
  // v1 fallback
  let item=kitemById(kcat,kid);
  if(!item){
    document.getElementById('kdetail').innerHTML=`<div class="kd-empty"><div class="kd-empty-icon">📖</div>请从左侧选择知识条目</div>`;
    return;
  }
  let st=item.status||'stable';
  let stagCls=st==='active'?'active':st==='limited'?'limited':'stable';

  let srcs='';
  if(item.sources&&item.sources.length){
    srcs=`<div class="kd-sec"><div class="kd-sec-h">🔗 数据来源 (${item.sources.length})</div>`;
    item.sources.forEach(s=>{
      let sst=s.status||'stable';
      srcs+=`<div class="kd-src">
        <span style="font-size:14px">🔗</span>
        <span class="kd-url">${h(s.url)}</span>
        <span class="kd-what">${h(s.what||'')}</span>
        <span class="kd-tag s-${sst}">${h(s.method||'')} · ${h(s.freq||'')}</span>
      </div>`;
    });
    srcs+='</div>';
  }

  let ks='';
  if(item.knowledge&&item.knowledge.length){
    ks=`<div class="kd-sec"><div class="kd-sec-h">📚 知识点</div>`;
    item.knowledge.forEach(k=>{
      ks+=`<div class="kd-ks">
        <div class="kd-ks-h">
          <span>${h(k.section)}</span>
          ${k.verified?`<span class="kd-verified">${h(k.verified)}</span>`:''}
        </div>
        <ul class="kd-ks-list">${k.items.map(i=>`<li>${h(i)}</li>`).join('')}</ul>
      </div>`;
    });
    ks+='</div>';
  }

  let chs='';
  if(item.changes&&item.changes.length){
    chs=`<div class="kd-sec"><div class="kd-sec-h">📅 变更记录</div>`;
    item.changes.forEach(c=>{
      chs+=`<div class="kd-chg-date">${h(c.date)}</div><ul class="kd-chg-list">${c.items.map(i=>`<li>${h(i)}</li>`).join('')}</ul>`;
    });
    chs+='</div>';
  }

  let ins=item.insight?`<div class="kd-insight">💡 ${h(item.insight)}</div>`:'';

  document.getElementById('kdetail').innerHTML=`
    <div class="kd-card">
      <div class="kd-h">
        <div class="kd-icon">${item.icon||'📄'}</div>
        <div class="kd-info">
          <div class="kd-name">${h(item.name)}</div>
          ${item.subtitle?`<div class="kd-sub">${h(item.subtitle)}</div>`:''}
        </div>
        <span class="kd-stag ${stagCls}">${h(item.statusText||st)}</span>
      </div>
      ${srcs}
      ${ks}
      ${chs}
      ${ins}
    </div>`;
}

// ── SYSTEM ──
function renderSystem(){
  // Token stats
  let today='5/25';
  let tdTokens=tokens.filter(t=>t.date===today);
  let totalIn=tdTokens.reduce((s,t)=>s+(t.tokens_in||0),0);
  let totalOut=tdTokens.reduce((s,t)=>s+(t.tokens_out||0),0);
  let totalCost=tdTokens.reduce((s,t)=>s+(t.cost||0),0);
  let top10=[...tokens].sort((a,b)=>(b.tokens_in+b.tokens_out)-(a.tokens_in+a.tokens_out)).slice(0,10);
  document.getElementById('tokstats').innerHTML=`
    <div class="scard" style="margin-bottom:12px"><h4>📊 Token 用量统计</h4>
      <div style="display:flex;gap:24px;margin-bottom:12px">
        <div><div class="tok-num">${(totalIn+totalOut).toLocaleString()}</div><div class="tok-sub">今日总 Token</div></div>
        <div><div class="tok-num">$${totalCost.toFixed(2)}</div><div class="tok-sub">今日花费</div></div>
        <div><div class="tok-num">${tdTokens.length}</div><div class="tok-sub">今日任务数</div></div>
      </div>
      <table class="tok-tbl">
        <thead><tr><th>任务</th><th>模型</th><th>Token 数</th><th>花费</th><th>日期</th></tr></thead>
        <tbody>${top10.map(t=>`<tr><td>${h(t.task)}</td><td>${h(t.model)}</td><td>${(t.tokens_in+t.tokens_out).toLocaleString()}</td><td>$${t.cost.toFixed(2)}</td><td>${h(t.date)}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;

  // Knowledge accordion — 兼容新旧数据格式
  let kaccHtml='<div class="empty">📖 知识数据已移至「知识」Tab 查看</div>';
  if(Array.isArray(knowledge)&&knowledge.length){
    kaccHtml=knowledge.map((k,i)=>`
      <div class="kacc">
        <div class="kacc-h" onclick="togKacc(this)"><span class="ka-arr">▶</span>📖 ${h(k.source)}<span style="font-size:11px;color:var(--tx3);margin-left:auto">${h(k.date)}</span></div>
        <div class="kacc-b">
          <div class="kl">💡 知识点：${h(k.learned)}</div>
          ${k.files&&k.files.length?`<div class="kf"><div style="font-size:11px;color:var(--tx3);margin-bottom:4px">📂 相关文件 (${k.files.length})</div>${k.files.map(f=>`<div class="kfi" onclick="window.open('/'+encodeURI('${f}'),'_blank')">📄 ${h(f.split('/').pop())}</div>`).join('')}</div>`:''}
        </div>
      </div>
    `).join('');
  }
  document.getElementById('kaccs').innerHTML=kaccHtml;

  // System grid
  let pn=tasks.filter(t=>t.status==='pending').length;
  let dn=tasks.filter(t=>t.status==='done').length;
  let ip=tasks.filter(t=>t.status==='in_progress').length;
  document.getElementById('sgrid').innerHTML=`
    <div class="scard"><h4>🤖 Agent 状态</h4>
      <div class="srow"><span>状态</span><span style="color:var(--gn)">${sys.agent||'运行中'}</span></div>
      <div class="srow"><span>运行时长</span><span>${sys.uptime||'--'}</span></div>
      <div class="srow"><span>启动时间</span><span>${sys.started||'--'}</span></div>
      <div class="srow"><span>钉钉</span><span style="color:var(--gn)">${sys.dingtalk||'--'}</span></div>
    </div>
    <div class="scard"><h4>📊 数据概览</h4>
      <div class="srow"><span>总任务</span><span>${tasks.length}</span></div>
      <div class="srow"><span>进行中</span><span>${ip}</span></div>
      <div class="srow"><span>待处理</span><span>${pn}</span></div>
      <div class="srow"><span>已完成</span><span>${dn}</span></div>
    </div>
    <div class="scard"><h4>📚 知识库</h4><div class="ktags">${(sys.platKB||[]).map(k=>`<span class="kt" onclick="toast('知识库: ${h(k)}')">${h(k)}</span>`).join('')}</div></div>
    <div class="scard"><h4>🛠️ 技能 (${skills.length})</h4>${skills.map(s=>`<span class="stag"><span class="dd"></span>${h(s)}</span>`).join('')}</div>
    <div class="scard" style="grid-column:1/-1"><h4>⏰ Cron 任务</h4>${(sys.cron||[]).map(c=>`<div class="srow"><span>${h(c.name)}</span><span><code style="font-size:11px;color:var(--tx3)">${h(c.schedule)}</code></span><span style="color:${c.status==='running'?'var(--gn)':'var(--tx3)'}">${c.status==='running'?'运行中':'已暂停'}</span></div>`).join('')}</div>
  `;
}

function togKacc(el){
  let a=el.querySelector('.ka-arr'),b=el.nextElementSibling;
  a.classList.toggle('op');b.classList.toggle('op');
}

// ── SEARCH (Cmd+K) ──
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}
  if(e.key==='Escape')closeSearch();
});
function openSearch(){
  document.getElementById('searchOverlay').classList.add('open');
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML='';
  setTimeout(()=>document.getElementById('searchInput').focus(),50);
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('open');
}
function doSearch(){
  let q=document.getElementById('searchInput').value.toLowerCase().trim();
  let r=document.getElementById('searchResults');
  if(!q){r.innerHTML='';return;}
  // Search tasks
  let tr=tasks.filter(t=>t.title.toLowerCase().includes(q)||(t.project||'').toLowerCase().includes(q)).slice(0,8);
  // Search files from projects
  let fr=[];
  projects.forEach(p=>{
    function walk(nodes,prefix){
      if(!nodes)return;
      nodes.forEach(n=>{
        if(n.type==='folder'){walk(n.children,prefix+n.name+'/');return;}
        if(n.name.toLowerCase().includes(q)||(n.path||'').toLowerCase().includes(q))fr.push(n);
      });
    }
    walk(p.files||[],'');
  });
  fr=fr.slice(0,8);
  r.innerHTML=(tr.length?tr.map(t=>`<div class="search-res" onclick="closeSearch();openSlide('${t.id}')"><span class="sr-icon">📋</span><span class="sr-txt">${h(t.title)}</span><span class="sr-sub">${h(t.project||'')}</span></div>`).join(''):'')
    +(fr.length?fr.map(f=>`<div class="search-res" onclick="closeSearch();window.open('/'+encodeURI('${f.path}'),'_blank')"><span class="sr-icon">📄</span><span class="sr-txt">${h(f.name)}</span><span class="sr-sub">${h(f.path||'')}</span></div>`).join(''):'')
    +(!tr.length&&!fr.length?`<div class="search-empty">未找到 "${h(q)}" 相关结果</div>`:'');
}

// ── HELPERS ──
function isOverdue(t){
  if(t.status==='done'||!t.deadline)return false;
  let now=new Date();now.setHours(0,0,0,0);let dl=t.deadline;
  let m2=dl.match(/(\d+)月中旬/);
  if(m2)return new Date(now.getFullYear(),parseInt(m2[1])-1,15)<now;
  let wd={一:1,二:2,三:3,四:4,五:5,六:6,日:0};
  let m3=dl.match(/本周([一二三四五六日])/);
  if(m3){
    let cur=now.getDay();
    let mon=new Date(now);mon.setDate(now.getDate()-(cur===0?6:cur-1));
    let dt=new Date(mon);dt.setDate(mon.getDate()+wd[m3[1]]-1);
    return dt<now;
  }
  let m=dl.match(/(\d+)月(\d+)/);
  if(m)return new Date(now.getFullYear(),parseInt(m[1])-1,parseInt(m[2]))<now;
  return false;
}
function countOverdue(){return tasks.filter(t=>isOverdue(t)).length}
function h(s){if(!s)return'';let d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m,t){let c=document.getElementById('toasts');let e=document.createElement('div');e.className='toast';e.textContent=m;c.appendChild(e);setTimeout(()=>e.remove(),2500)}
</script>
