<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hermes 数据中心</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #faf9f7;
    --surface: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --accent: #5e6ad2;
    --accent-light: #eef2ff;
    --green: #10b981;
    --green-bg: #ecfdf5;
    --yellow: #f59e0b;
    --yellow-bg: #fffbeb;
    --red: #ef4444;
    --red-bg: #fef2f2;
    --blue: #3b82f6;
    --blue-bg: #eff6ff;
    --purple: #8b5cf6;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ===== Desktop Sidebar ===== */
  .layout {
    display: flex;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
  }

  .sidebar-logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    padding: 8px 12px;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  .sidebar-logo span {
    color: var(--accent);
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }

  .nav-item:hover {
    background: rgba(0,0,0,0.04);
    color: var(--text);
  }

  .nav-item.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }

  .nav-icon { font-size: 18px; width: 24px; text-align: center; }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px;
    font-size: 11px;
    color: var(--text-tertiary);
    border-top: 1px solid var(--border);
  }

  /* ===== Main Content ===== */
  .main {
    flex: 1;
    padding: 24px 32px;
    max-width: 1100px;
    overflow-y: auto;
  }

  .page-header {
    margin-bottom: 24px;
  }

  .page-header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .page-header .update-time {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }

  /* ===== Stats Grid ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }

  .stat-card .label {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 4px;
  }

  .stat-card .value {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .stat-card .sub {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }

  /* ===== Grade Badges ===== */
  .grade-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  .grade-S { background: #fef3c7; color: #92400e; }
  .grade-A { background: #dbeafe; color: #1e40af; }
  .grade-B { background: #d1fae5; color: #065f46; }
  .grade-C { background: #f3f4f6; color: #4b5563; }
  .grade-D { background: #fef2f2; color: #991b1b; }

  /* ===== Card ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card h3 .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ===== Grade Bar ===== */
  .grade-bar-wrap {
    display: flex;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .grade-bar-wrap .seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    transition: width 0.3s;
  }

  .grade-legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .grade-legend span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .grade-legend .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }

  /* ===== Table ===== */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  tr:last-child td { border-bottom: none; }

  /* ===== File List ===== */
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .file-item:last-child { border-bottom: none; }

  .file-icon {
    font-size: 20px;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-meta {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .file-size {
    font-size: 11px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  /* ===== Status Dots ===== */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .status-running { background: var(--green); }
  .status-paused { background: var(--yellow); }
  .status-error { background: var(--red); }

  /* ===== Bottom Tab Bar (Mobile) ===== */
  .bottom-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 8px 8px env(safe-area-inset-bottom, 8px);
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .bottom-nav-inner {
    display: flex;
    gap: 2px;
    max-width: 500px;
    margin: 0 auto;
  }

  .bottom-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 4px;
    border-radius: var(--radius-sm);
    border: none;
    background: none;
    font-family: inherit;
    font-size: 10px;
    color: var(--text-tertiary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .bottom-tab .tab-icon { font-size: 20px; }

  .bottom-tab.active {
    color: var(--accent);
    background: var(--accent-light);
  }

  /* ===== Page Panel ===== */
  .page { display: none; }
  .page.active { display: block; }

  /* ===== Loading ===== */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-tertiary);
    font-size: 13px;
  }

  .loading::before {
    content: '';
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center;
    padding: 40px;
    color: var(--text-tertiary);
    font-size: 13px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .sidebar {
      display: none;
    }

    .bottom-nav {
      display: block;
    }

    .main {
      padding: 20px 16px 100px;
    }

    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-card {
      padding: 12px 14px;
    }

    .stat-card .value {
      font-size: 20px;
    }

    .page-header h1 {
      font-size: 18px;
    }
  }

  @media (min-width: 769px) {
    .bottom-nav {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- Desktop Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">Hermes <span>数据中心</span></div>
    <button class="nav-item active" data-page="stores">
      <span class="nav-icon">📊</span> 门店经营
    </button>
    <button class="nav-item" data-page="abtest">
      <span class="nav-icon">📈</span> AB 测试
    </button>
    <button class="nav-item" data-page="reports">
      <span class="nav-icon">📋</span> 报告中心
    </button>
    <button class="nav-item" data-page="system">
      <span class="nav-icon">⚙️</span> 系统状态
    </button>
    <div class="sidebar-footer">
      Hermes Agent · 数据自动更新
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    
    <!-- ====== 门店经营 ====== -->
    <div class="page active" id="page-stores">
      <div class="page-header">
        <h1>📊 门店经营看板</h1>
        <div class="update-time" id="stores-update">加载中...</div>
      </div>
      <div class="stats-grid" id="stores-stats">
        <div class="loading">加载中...</div>
      </div>
      <div class="card" id="stores-grade-card">
        <h3><span class="dot"></span> SABCD 评分分布</h3>
        <div class="loading">加载中...</div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> 数据文件</h3>
        <div id="stores-files" class="loading">加载中...</div>
      </div>
    </div>

    <!-- ====== AB 测试 ====== -->
    <div class="page" id="page-abtest">
      <div class="page-header">
        <h1>📈 AB 测试</h1>
        <div class="update-time" id="abtest-update">加载中...</div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> 测试方案</h3>
        <div id="abtest-list" class="loading">加载中...</div>
      </div>
    </div>

    <!-- ====== 报告中心 ====== -->
    <div class="page" id="page-reports">
      <div class="page-header">
        <h1>📋 报告中心</h1>
        <div class="update-time" id="reports-update">加载中...</div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> 📅 周报 / 月报</h3>
        <div id="weekly-list" class="loading">加载中...</div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> 📆 日报</h3>
        <div id="daily-list" class="loading">加载中...</div>
      </div>
    </div>

    <!-- ====== 系统状态 ====== -->
    <div class="page" id="page-system">
      <div class="page-header">
        <h1>⚙️ 系统状态</h1>
        <div class="update-time" id="system-update">加载中...</div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> Cron 定时任务</h3>
        <div id="cron-list" class="loading">加载中...</div>
      </div>
    </div>

  </main>

</div>

<!-- Mobile Bottom Nav -->
<nav class="bottom-nav" id="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bottom-tab active" data-page="stores">
      <span class="tab-icon">📊</span> 门店
    </button>
    <button class="bottom-tab" data-page="abtest">
      <span class="tab-icon">📈</span> AB测试
    </button>
    <button class="bottom-tab" data-page="reports">
      <span class="tab-icon">📋</span> 报告
    </button>
    <button class="bottom-tab" data-page="system">
      <span class="tab-icon">⚙️</span> 系统
    </button>
  </div>
</nav>

<script>
// ========== Navigation ==========
const DATA_BASE = './data/';
let currentPage = 'stores';

function switchPage(name) {
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  
  document.querySelectorAll('.nav-item, .bottom-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.page === name);
  });
}

document.querySelectorAll('.nav-item, .bottom-tab').forEach(el => {
  el.addEventListener('click', () => switchPage(el.dataset.page));
});

// ========== Data Loading ==========
async function loadJSON(name) {
  try {
    const res = await fetch(DATA_BASE + name + '.json?' + Date.now());
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch(e) {
    console.error('Load error:', name, e);
    return null;
  }
}

// ========== 门店经营 ==========
async function renderStores() {
  const data = await loadJSON('store_grading');
  if (!data) {
    document.getElementById('stores-stats').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  
  document.getElementById('stores-update').textContent = '更新于 ' + (data.updated || '');
  
  // Stats
  const summary = data.summary || {};
  const grades = summary.grade_distribution || {};
  const total = summary.total_stores || 0;
  const feeRate = summary['费比'] || '-';
  
  let statsHTML = `
    <div class="stat-card">
      <div class="label">门店总数</div>
      <div class="value">${total.toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="label">S 级门店</div>
      <div class="value" style="color:#92400e">${grades.S || 0}</div>
    </div>
    <div class="stat-card">
      <div class="label">A 级门店</div>
      <div class="value" style="color:#1e40af">${grades.A || 0}</div>
    </div>
    <div class="stat-card">
      <div class="label">总体费比</div>
      <div class="value">${typeof feeRate === 'number' ? feeRate.toFixed(1) + '%' : feeRate}</div>
    </div>
  `;
  document.getElementById('stores-stats').innerHTML = statsHTML;
  
  // Grade distribution bar
  const gradeColors = { S: '#f59e0b', A: '#3b82f6', B: '#10b981', C: '#9ca3af', D: '#ef4444', '数据不足': '#d1d5db' };
  const gradeOrder = ['S', 'A', 'B', 'C', 'D', '数据不足'];
  let barHTML = '<div class="grade-bar-wrap">';
  let legendHTML = '<div class="grade-legend">';
  
  gradeOrder.forEach(g => {
    const count = grades[g] || 0;
    const pct = total > 0 ? (count / total * 100).toFixed(1) : 0;
    barHTML += `<div class="seg" style="width:${pct}%;background:${gradeColors[g]}" title="${g}: ${count} (${pct}%)">${pct > 5 ? g + ' ' + pct + '%' : ''}</div>`;
    legendHTML += `<span><span class="swatch" style="background:${gradeColors[g]}"></span> ${g}: ${count}</span>`;
  });
  
  barHTML += '</div>';
  legendHTML += '</div>';
  
  document.getElementById('stores-grade-card').innerHTML = `
    <h3><span class="dot"></span> SABCD 评分分布</h3>
    ${barHTML}
    ${legendHTML}
  `;
  
  // Files
  const file = data.file || '未知';
  document.getElementById('stores-files').innerHTML = `
    <div class="file-item">
      <span class="file-icon">📊</span>
      <div class="file-info">
        <div class="file-name">${file}</div>
        <div class="file-meta">最新门店分级结果</div>
      </div>
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--text-tertiary)">
      📁 数据目录: 甘/门店标签/
    </div>
  `;
}

// ========== AB 测试 ==========
async function renderABTest() {
  const data = await loadJSON('ab_tests');
  if (!data) {
    document.getElementById('abtest-list').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  
  document.getElementById('abtest-update').textContent = '更新于 ' + (data.updated || '');
  
  const tests = data.tests || [];
  if (tests.length === 0) {
    document.getElementById('abtest-list').innerHTML = '<div class="empty">暂无 AB 测试方案</div>';
    return;
  }
  
  let html = '<div class="table-wrap"><table><thead><tr><th>文件</th><th>类型</th><th>大小</th><th>子表</th></tr></thead><tbody>';
  
  tests.forEach(t => {
    const typeIcon = t.type === 'markdown' ? '📝' : '📊';
    const typeName = t.type === 'markdown' ? '分析文档' : 'Excel';
    const sheets = t.sheets ? t.sheets.join(', ') : '-';
    const size = t.size_kb ? t.size_kb + ' KB' : '-';
    html += `<tr>
      <td>${typeIcon} ${t.file}</td>
      <td>${typeName}</td>
      <td>${size}</td>
      <td style="font-size:11px;color:var(--text-tertiary)">${sheets}</td>
    </tr>`;
  });
  
  html += '</tbody></table></div>';
  document.getElementById('abtest-list').innerHTML = html;
}

// ========== 报告中心 ==========
async function renderReports() {
  const data = await loadJSON('reports');
  if (!data) {
    document.getElementById('weekly-list').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  
  document.getElementById('reports-update').textContent = '更新于 ' + (data.updated || '');
  
  // Weekly
  const weekly = data.weekly || [];
  if (weekly.length === 0) {
    document.getElementById('weekly-list').innerHTML = '<div class="empty">暂无周报</div>';
  } else {
    let html = '';
    weekly.forEach(r => {
      const icon = r.type === '.pptx' ? '📽️' : r.type === '.md' ? '📝' : '📊';
      html += `<div class="file-item">
        <span class="file-icon">${icon}</span>
        <div class="file-info">
          <div class="file-name">${r.file}</div>
          <div class="file-meta">${r.date}</div>
        </div>
        <span class="file-size">${r.size_kb} KB</span>
      </div>`;
    });
    document.getElementById('weekly-list').innerHTML = html;
  }
  
  // Daily
  const daily = data.daily || [];
  if (daily.length === 0) {
    document.getElementById('daily-list').innerHTML = '<div class="empty">暂无日报</div>';
  } else {
    let html = '';
    daily.forEach(r => {
      html += `<div class="file-item">
        <span class="file-icon">📄</span>
        <div class="file-info">
          <div class="file-name">${r.file}</div>
          <div class="file-meta">${r.date}</div>
        </div>
      </div>`;
    });
    document.getElementById('daily-list').innerHTML = html;
  }
}

// ========== 系统状态 ==========
async function renderSystem() {
  const data = await loadJSON('system');
  if (!data) {
    document.getElementById('cron-list').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  
  document.getElementById('system-update').textContent = '更新于 ' + (data.updated || '');
  
  // Cron jobs
  const jobs = data.cron_jobs || [];
  if (jobs.length === 0) {
    document.getElementById('cron-list').innerHTML = '<div class="empty">暂无定时任务</div>';
    return;
  }
  
  let html = '<div class="table-wrap"><table><thead><tr><th>任务</th><th>调度</th><th>状态</th></tr></thead><tbody>';
  
  jobs.forEach(j => {
    const name = j.name || j.id || j.job_id || 'Unknown';
    const schedule = j.schedule || j.cron || '-';
    const status = j.status || j.enabled ? 'running' : 'paused';
    const dot = status === 'running' || status === 'active' ? 'status-running' : 'status-paused';
    html += `<tr>
      <td>${name}</td>
      <td style="font-family:monospace;font-size:12px">${schedule}</td>
      <td><span class="status-dot ${dot}"></span> ${status}</td>
    </tr>`;
  });
  
  html += '</tbody></table></div>';
  document.getElementById('cron-list').innerHTML = html;
}

// ========== Init ==========
async function init() {
  await Promise.all([
    renderStores(),
    renderABTest(),
    renderReports(),
    renderSystem()
  ]);
}

init();

// Refresh every 5 minutes
setInterval(init, 5 * 60 * 1000);
